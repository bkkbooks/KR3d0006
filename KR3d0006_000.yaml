  text: 欽定四庫全書子部四
  hash: sha256:940855fe39bdf892ef95be162cb092ce2270c5f8a764e60b4375e12cb73cf01d
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3d0006_WYG_000-1a, image: WYG0730/WYG0730-0609a.png}
body:
  text: 救荒本草目録農家類卷一草部二百四十五種卷二草部卷三草部卷四草部卷五木部八十種卷六木部卷七米穀部二十種果部二十三種卷八菜部四十六種臣等謹案救荒本草八卷明周王朱橚撰橚明太祖第五子洪武十一年封十四年就藩開封建文時廢徙雲南成祖復其爵洪熙元年薨諡曰定明史本傳稱橚好學能詞賦嘗作元宫詞百章以國土夷曠庶草蕃廡考核其可佐飢饉者四百餘種繪圖上之即是書也李時珍本草綱目以此書及普濟方俱云洪武初周憲王著考憲王有燉於仁宗初始嗣封其説殊誤是編為嘉靖乙卯陸柬所重刋每卷又分為前後共成四卷其見諸舊本草者一百三十八種新增者二百七十六種皆詳核可據前有柬自序亦稱周憲王著蓋當時以親藩貴重刋書皆不題名故輾轉傳訛有所不免今特為糾正焉乾隆四十三年九月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀救荒本草原序植物之生於天地間莫不各有所用茍不見諸載籍雖老農老圃亦不能盡識而可亨可芼者皆躪藉於牛羊鹿豕而已自神農氏品嘗草木辨其寒溫甘苦之性作為醫藥以濟人之天札後世賴以延生而本草書中所載多伐病之物而於可茹以充腹者則未之及也敬惟周王殿下體仁遵義孳孳為善凡可以濟人利物之事無不留意嘗讀孟子書至于五穀不熟不如荑稗因念林林總總之民不幸罹於旱潦五穀不熟則可以療飢者恐不止荑稗而已也茍能知悉而載諸方册俾不得已而求食者不惑甘苦於荼薺取昌陽棄烏喙因得以裨五穀之缺則豈不為救荒之一助哉於是購田夫野老得甲坼勾萌者四百餘種植於一圃躬自閲視俟其滋長成熟乃召畫工繪之為圗仍疏其花實根幹皮葉之可食者彚次為書一帙名曰救荒本草命臣同為之序臣惟人情於飽食暖衣之際多不以凍餒為虞一旦遇患難則莫知所措惟付之於無可奈何故治已治人鮮不失所今殿下處富貴之尊保有邦域於無可虞度之時乃能念生民萬一或有之患深得古聖賢安不忘危之旨不亦善乎神農品嘗草木以療斯民之疾殿下區别草木欲濟斯民之飢同一仁心之用也雖然今天下方樂雍熙泰和之治禾麥産瑞家給人足不必論及於荒政而殿下亦豈忍覩斯民仰食於草木哉是編之作蓋欲辨載嘉植不沒其用期與圗經本草並傳于後世庶幾萍實有徵而凡可以亨芼者得不躪藉於牛羊鹿豕茍或見用於荒嵗其及人之功利又非藥石所可擬也尚慮四方所産之多不能盡録補其未備則有俟於後日云永樂四年嵗次丙戌秋八月奉議大夫周府左長史臣卞同序
