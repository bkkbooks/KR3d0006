body:
  text: 救荒本草卷一明周王朱橚撰草部葉可食本草原有四十種刺薊菜本草名小薊俗名青刺薊北人呼為千針草出冀州生平澤中今處處有之苗高尺餘葉似苦苣葉莖葉俱有刺而葉不皺葉中心出花頭如紅藍花而青紫色性涼無毒一云味甘性溫救飢採嫩苗葉煠熟水浸淘淨油鹽調食甚美除風熱治病文具本草草部大小薊條下大薊舊不著所出州土云生山谷中今鄭州山野間亦有之苗高三四尺莖五稜葉似大花苦苣菜葉莖葉俱多刺其葉多皺葉中心開淡紫花味苦性平無毒根有毒救飢採嫩苗葉煠熟水淘去苦味油鹽調食治病文具本草草部大小薊條下山莧菜本草名牛膝一名百倍俗名腳斯蹬又名對節菜生河內川谷及臨胊江淮閩粵關中蘇州皆有之然皆不及懷州者為真蔡州者最長大柔潤今鈞州山野中亦有之苗高二尺已來莖方青紫色其莖有節如鶴膝又如牛膝狀以此名之葉似莧菜葉而長頗尖􅕏音哨葉皆對生開花作穗根味苦酸性平無毒葉味甘微酸惡螢火陸英龜甲畏白前救飢採苗葉煠熟換水浸去酸味淘淨油鹽調食治病文具本草草部牛膝條下欵冬花一名橐音托石一名顆凍一名虎鬚一名莵奚一名氐冬生常山山谷及上黨水傍關中蜀北宕音蕩昌秦州雄州皆有今鈞州密縣山谷間亦有之莖青微帶紫色葉似葵葉甚大而叢生又似石葫蘆葉頗團開黃花根紫色圗經云葉如荷而斗直大者容一升小者容數合俗呼為蜂斗葉又名水斗葉此物不避冰雪最先春前生雪中出花世謂之鑽凍又云有葉似萆薢開黃花青紫萼去土一二寸初出如菊花萼通直而肥實無子陶隱居所謂出高麗百濟者近此類也其葉味苦花味辛甘性溫無毒杏仁為之使得紫菀良惡皂莢硝石元參畏貝母辛夷麻黃黃芩黃連青箱救飢採嫩葉煠熟水浸淘去苦味油鹽調食治病文具本草草部條下萹蓄亦名萹竹生東萊山谷今在處有之布地生道傍苗似石竹葉微闊嫩緑如竹赤莖如叉股節間花出甚細淡桃紅色結小細子根如蒿根苗葉味苦性平一云味井無毒救飢採苗葉煠熟水浸淘淨油鹽調食治病文具本草草部條下大藍生河內平澤今處處有之人家園圃中多種苗高尺餘葉類白菜葉微厚而狹窄尖􅕏淡粉青色莖義梢間開黃花結小莢其子黑色本草謂菘藍可以為靛染青以其葉似菘菜故名菘藍又名馬藍爾雅所謂葴馬藍是也味苦性寒無毒救飢採葉煠熟水浸去苦味油鹽調食治病文具本草草部藍實條下石竹子本草名瞿麥一名巨句麥一名大菊一名大蘭又名杜母草燕麥蘥音藥麥生大山川谷今處處有之苗高一尺已來葉似獨掃葉而尖小又似小竹葉而細窄莖亦有節梢間開紅白花而結蒴內有小黑子味苦辛性寒無毒蓑草牡丹為之使惡螵蛸救飢採嫩苗葉煠熟水浸淘淨油鹽調食治病文具本草草部瞿麥條下紅花菜本草名紅藍花一名黃藍出梁漢及西域滄魏亦種之今處處有之苗高二尺許莖葉有刺似刺薊葉而潤澤窊五化切面梢結梂彚音求胃亦多刺開紅花蘂出梂上圃人採之採已復出至盡而罷梂中結實白顆如小豆大其花暴乾以染真紅及作胭脂花味辛性溫無毒葉味井救飢採嫩葉煠熟油鹽調食子可笮音乍作油用治病文具本草草部紅藍花條下萱草花俗名川草花本草一名鹿蔥謂生山野花名宜男風土記云懷妊婦人佩其花生男故也人家園圃中多種其葉就地叢生兩邊分垂葉似菖蒲葉而柔弱又似粉條兒菜葉而肥大葉間攛葶開金黃花味甘無毒根涼亦無毒葉味井救飢採嫩苗葉煠熟水浸淘淨油鹽調食治病文具本草草部條下車輪菜本草名車前子一名當道一名芣苡音浮以一名蝦蟆衣一名牛遺一名勝舄音昔爾雅云馬舄幽州人謂之一舌草生滁州及真定平澤今處處有之春初生苗葉布地如匙面纍年者長及尺餘又似玉簮葉梢大而薄葉叢中心攛葶三四莖作長穗如鼠尾花甚密青色微赤結實如葶藶子赤黑色生道傍味甘鹹性寒無毒一云味甘性平葉及根味甘性寒常山為之使救飢採嫩苗葉煠熟水浸去涎沫淘淨油鹽調食治病文具本草草部車前子條下白水葒苗本草名葒草一名鴻䕵音纈有赤白二色爾雅云紅蘢古其大者蘬鄭詩云隰有遊龍是也所在有之生水邊下濕地葉似蓼葉而長大有澀毛花開紅白又似馬蓼其莖有節而赤味鹹性微寒無毒救飢採嫩苗葉煠熟水浸淘淨油鹽調食洗淨蒸食亦可治病文具本草草部葒草條下黃耆一名戴糝一名戴椹一名獨椹一名茇草一名蜀脂一名百本一名王孫生蜀郡山谷及白水漢中河東陜西出綿上呼為綿黃耆今處處有之根長二三尺獨莖叢生枝􅗰其葉扶踈作羊齒狀似槐葉微尖小又似蒺䔧葉闊大而青白色開黃紫花如槐花大結小尖角長寸許味甘性微溫無毒一云味苦微寒惡龜甲白蘚皮救飢採嫩苗葉煠熟換水浸淘洗去苦味油鹽調食藥中補益呼為羊肉治病文具本草草部條下威靈仙一名能消出商州上洛華山並平澤及陜西河東河北河南河湖石州寧化等州郡不聞水聲者良今密縣梁家衝山野中亦有之苗高一二尺莖方如叉股四稜莖多細茸白毛葉似栁葉而闊邊有鋸齒又似旋覆花葉其葉作層生每層六七葉相對排如車輪樣有六層至七層者花淺紫色或碧白色作穗似蒲臺子亦有似菊花頭者結實青色根稠密多鬚味苦性溫無毒惡茶及麵湯以甘草梔子代飲可也救飢採葉煠熟換水浸去苦味再以水淘淨油鹽調食治病文具本草草部條下馬兜鈴根名雲南根又名土青木香生關中及信州滁州河東河北江淮夔音馗浙州郡皆有今高阜音負去處亦有之春生苗如藤蔓葉如山藥葉而厚大背白開黃紫花頗類枸把花結實如鈴作四五瓣葉脫時鈴尚垂之其狀如馬項鈴故得名味苦性寒又云平無毒救飢採葉煠熟用水浸去苦味淘淨油鹽調食治病文具本草草部條下旋覆花一名戴椹一名金沸草一名盛椹上黨田野人呼為金錢花爾雅云蕧盜庚出隨州生平澤川谷今處處有之苗多近水傍初生大如紅花葉而無刺苗長二三尺已來葉似栁葉稍寬大莖細如蒿􅗰開花似菊花如銅錢大深黃色花味鹹甘性溫微冷利有小毒葉味苦性涼救飢採葉煠熟水浸去苦味淘淨油鹽調食治病文具本草草部條下防風一名銅藝一名茴草一名百枝一名屏風一名蕳根一名百蜚生同州沙苑川澤邯鄲琅邪上蔡陜西山東處處皆有今中牟田野中亦有之根上黃色與蜀葵根相類梢細短莖葉俱青緑色莖深而葉淡葉似青蒿葉而闊大又似米蒿葉而稀踈莖似茴香開細白花結實似胡荽子而大味甘辛性溫無毒殺附子毒惡乾薑藜蘆白斂芫花又有石防風亦療頭風眩痛又有義頭者令人發狂義尾者發痼疾救飢採嫩苗葉作菜茹煠食極爽口治病文具本草草部條下鬱臭苗本草茺蔚子是也一名益母一名益明一名大札一名貞蔚皆云蓷音推益母也亦謂蓷臭穢生海濱池澤今田野處處有之葉似荏子葉又似艾葉而薄小色青莖方節節開小白花結子黑茶褐色三稜細長味辛甘微溫一云微寒無毒救飢採苗葉煠熟水浸淘淨油鹽調食治病文具本草草部茺蔚子條下澤漆本草一名漆莖大戟苗也生大山川澤及冀州鼎州明州今處處有之苗高二三尺科義生莖紫赤色葉似栁葉微細短開黃紫花狀似杏花而瓣頗長生時摘葉有白汁出亦能嚙音咬人故以為名味苦辛性微寒無毒一云有小毒一云性冷微毒小豆為之使惡薯蕷今嘗葉味澀苦食過回味甜救飢採葉及嫩莖煠熟水浸淘淨油鹽調食採嫩葉蒸過晒乾做茶喫亦可治病文具本草草部條下酸漿草本草名酢與醋字同漿草一名醋母草一名鳩酸草俗為小酸茅舊不著所出州土今處處有之生道傍下濕地葉如初生小水萍每莖端皆叢生三葉開黃花結黑子南人用苗揩鍮音偷石器令白如銀色光艷味酸性寒無毒救飢採嫩苗葉生食治病文具本草草部酢漿條下蛇床子一名蛇粟一名蛇米一名虺牀一名思益一名繩毒一名棗棘一名牆蘼爾雅一名盱生臨淄川谷田野今處處有之苗高二三尺青碎作叢似蒿枝葉似黃蒿葉又似小葉蘼蕪又似藁本葉每枝上有花頭百餘結同一窠開白花如傘蓋狀結子半黍大黃褐色味苦辛甘無毒性平一云有小毒惡牡丹巴豆貝母救飢採嫩苗葉煠熟水浸淘洗淨油鹽調食治病文具本草草部條下桔梗一名利如一名房圗一名白藥一名梗草一名薺苨生嵩高山谷及寃句和州解州今鈞州密縣山野亦有之根如手指大黃白色春生苗莖高尺餘葉似杏葉而長撱四葉相對而生嫩時亦可煮食開花紫碧色頗似牽牛花秋後結子葉名隱忍其根有心無心者乃薺苨也根葉味辛苦性微溫有小毒一云味苦性平無毒節皮為之使得牡礪逺志療恚怒得硝石石膏療傷寒畏白芨龍眼龍膽救飢採葉煠熟換水浸去苦味淘洗淨油鹽調食治病文具本草草部條下茴香一名蘹音懷香子北人呼為土茴香茴蘹聲相近故云耳今處處有之人家園圃多種苗高三四尺莖粗如筆管傍有淡黃袴葉抪莖而生袴葉上發生青色細葉似細蓬葉而長極踈細如糸髮狀袴葉間分生義枝梢頭開花花頭如傘蓋黃色結子如蒔蘿子微大而長亦有線瓣味苦辛性平無毒救飢採苗葉煠熟換水淘淨油鹽調食子調和諸般食味香美治病文具本草草部蘹香子條下夏枯草本草一名夕句一名乃東一名燕靣生蜀郡川谷及河淮浙滁平澤今祥符西田野中亦有之苗高二三尺其葉對節生葉似旋覆葉而極長大邊有細鋸齒背白上多氣脈紋路葉端開花作穗長二三寸許其花紫白似丹參花葉味苦微辛性寒無毒土瓜為之使俗又謂之鬱臭苗非是救飢採嫩葉煠熟換水浸淘去苦味油鹽調食治病文具本草草部條下藁本一名鬼卿一名地新一名微莖生崇山山谷及西川河東兖州杭州今衛輝輝縣栲栳圈山谷間亦有之俗名山園荽苗高五七寸葉似芎藭葉細小又似園荽葉而稀踈莖比園荽莖頗硬直味辛微苦性溫微寒無毒惡䕡茹畏青箱子救飢採嫩苗葉煠熟水浸淘淨油鹽調食治病文具本草草部條下柴胡一名地薰一名山菜一名茹草葉一名藝蒿生𢎞農川谷及寃句夀州淄州關陜江湖間皆有銀州者為勝今鈞州密縣山谷間亦有苗甚辛香莖青紫堅硬微有細線楞葉似竹葉而小開小黃花根淡赤色味苦性平微寒無毒半夏為之使惡皂莢畏女菀藜蘆又有苗似斜蒿亦有似麥門冬苗而短者開黃花生丹州結青子與他處者不類救飢採苗葉煠熟換水浸淘去苦味油鹽調食治病文具本草草部條下漏蘆一名野蘭俗名莢蒿根名鹿驪根俗呼為鬼油麻生喬山山谷及秦州海州單州曹兖州今鈞州新鄭沙岡間亦有之苗葉就地叢生葉似山芥菜葉而大又多花叉亦似白屈菜葉又似大蓬蒿葉及似風花菜腳葉而大葉中攛葶上開紅白花根苗味苦鹹性寒大寒無毒連翹為之使救飢採葉煠熟水浸淘去苦味油鹽調食治病文具本草草部條下龍膽草一名龍膽一名陵遊俗呼草龍膽生齊胊山谷及寃句襄州吳興皆有之今鈞州新鄭山岡間亦有根類牛膝而根一本十餘莖黃白色宿根苗高尺餘葉似栁葉而細短又似小竹開花如牽牛花青碧色似小鈴形樣陶隱居注云狀似龍葵味苦如膽因以為名味苦性寒大寒無毒貫衆小豆為之使惡防葵地黃又云浙中又有山龍膽草味苦澀此同類而别種也救飢採葉煠熟換水浸淘去苦味油鹽調食勿空腹服餌令人溺不禁治病文具本草草部條下鼠菊本草名鼠尾草一名葝音勍一名陵翹出黔州及所在平澤有之今鈞州新鄭岡野間亦有之苗高一二尺葉似菊花葉微小而肥厚又似野艾蒿葉而脆色淡緑莖端作四五穗穗似車前子穗而極踈細開五瓣淡粉紫花又有赤白二色花者黔中者苗如蒿爾雅謂葝鼠尾可以染皂味苦性微寒無毒救飢採葉煠熟換水浸去苦味再以水淘令淨油鹽調食治病文具本草草部鼠尾草條下前胡生陜西漢梁江淮荆襄江寧成州諸郡相孟越衢婺睦等州皆有今密縣梁家衝山野中亦有之苗高一二尺青白色似斜蒿味甚香美葉似野菊葉而瘦細頗似山蘿蔔葉亦細又似藝蒿開黲白花類蛇床子花秋間結實根細青紫色一云外黑裏白味甘辛微苦性微寒無毒半夏為之使惡皂莢畏藜蘆救飢採葉煠熟換水浸淘淨油鹽調食治病文具本草草部條下豬牙菜本草名角蒿一名莪蒿一名蘿蒿又名𦾰音廩蒿舊云生高岡及澤田漸洳處多有今在處有之生田野中苗高一二尺莖葉如青蒿葉似斜蒿葉而細又似蛇床子葉頗壯梢間開花紅赤色鮮明可愛花罷結角子似蔓菁角長二寸許微彎中有子黑色似王不留行子味辛苦性溫無毒一云性平有小毒救飢採嫩苗莖葉煠熟水浸去苦味淘淨油鹽調食治病文具本草草部角蒿條下地榆生桐柏山及寃句山谷今處處有之密縣山野中亦有此多宿根其苗初生布地後攛葶直高三四尺對分生葉葉似榆葉而狹細頗長作鋸齒狀青色開花如椹子紫黑色又類䜴故名玉豉其根外黑裏紅似栁根亦入釀酒藥燒作灰能爛石味苦甘酸性微寒一云沉寒無毒得髮良惡麥門冬救飢採嫩葉煠熟用水浸去苦味換水淘淨油鹽調食無茶時用葉作飲甚解熱治病文具本草草部條下川芎一名芎藭一名胡藭一名香果其苗葉名蘼蕪一名薇蕪一名茳蘺生武功川谷斜谷西嶺雍州川澤及寃句其關陜蜀川江東山中亦多有以蜀川者為勝今處處有之人家園圃多種苗葉似芹而葉微細窄却有花義又似白芷葉亦細又如園荽葉微壯又有一種葉似蛇床子葉而亦粗壯開白花其芎人家種者形塊大重實多脂潤其裏色白味辛甘性溫無毒山中出者瘦細味苦辛其節大莖細狀如馬銜謂之馬銜芎狀如雀腦者謂之雀腦芎此最有力白芷為之使畏黃連其蘼蕪味辛香性溫無毒救飢採葉煠熟換水浸去辛味淘淨油鹽調食亦可煮飲甚香治病文具本草草部條下葛勒子秧本草名葎草亦名葛勒蔓一名葛葎蔓又名澀蘿蔓南人呼為攬藤舊不著所出州土今田野道傍處處有之其苗延蔓而生藤長丈餘莖多細澀刺葉似萆麻葉而小亦薄莖葉極澀能抓挽人莖葉間開黃白花結子類山絲子其葉味甘苦性寒無毒救飢採嫩苗葉煠熟換水浸去苦味淘淨油鹽調食治病文具本草草部葎草條下連翹一名異翹一名蘭華一名折根一名軹音紙一名三亷爾雅謂之連一名連苕音條生太山山谷及河中江寧澤潤淄兖鼎嶽利州南康皆有之今密縣梁家衝山谷中亦有科苗高三四尺莖桿赤色葉如榆葉大而光色青黃邊微細鋸齒又似金銀花葉微尖􅕏音哨開花黃色可愛結房狀似山梔子蒴微匾而無稜瓣蒴中有子如雀舌樣極小其子折之間片片相比如翹以此得名味苦性平無毒葉亦味苦救飢採嫩葉煠熟換水浸去苦味淘洗淨油鹽調食治病文具本草草部條下仙靈脾本草名淫羊藿一名剛前俗名黃德祖千兩金乾雞筋放杖草棄杖草俗又呼三枝九葉草生上郡陽山山谷及江東陜西泰山漢中湖湘汾州等郡并永康軍皆有之今密縣山野中亦有苗高二尺許莖似小豆莖極細緊葉似杏葉頗長近蒂皆有一缺又似菉豆葉亦長而光梢間開花白色亦有紫色花作碎小獨頭子根紫色有鬚形類黃連狀味辛性寒一云性溫無毒生處不聞水聲者良薯蕷紫芝為之使救飢採嫩葉煠熟水浸去邪味淘淨油鹽調食治病文具本草草部淫羊藿條下青把本草名蜀羊泉一名泉一名羊飴俗名漆姑生蜀郡山谷及所在平澤皆有之今祥符縣西田野中亦有苗高二尺餘葉似菊葉稍長花開紫色子類枸把子生青熟紅根似逺志無心有槮疏錦切味苦性微寒無毒救飢採嫩葉煠熟水浸去苦味淘洗淨油鹽調食治病文具本草草部蜀羊泉條下野生薑本草名劉寄奴生江南其越州滁州皆有之今中牟南沙岡間亦有之莖似艾蒿長二三尺餘葉似菊葉而瘦細又似野艾蒿葉亦瘦細開花白色結實黃白色作細筒子蒴兒蓋蒿之類也其子似稗而細苗葉味苦性溫無毒救飢採嫩葉煠熟水浸淘去苦味油鹽調食治病文具本草草部劉寄奴條下馬蘭頭本草名馬蘭舊不著所出州土但云生澤傍如澤蘭北人見其花呼為紫菊以其花似菊而紫也苗高一二尺莖亦紫色葉似薄荷葉邊皆鋸齒又似地瓜兒葉微大味辛性平無毒又有山蘭生山側似劉寄奴葉無丫不對生花心微黃赤救飢採嫩苗葉煠熟新汲水浸去辛味淘洗淨油鹽調食治病文具本草草部條下狶蘞音杴俗名占糊菜俗又呼火杴草舊不著所出州郡今處處有之苗高三四尺金稜銀線素根紫秸莖義對節而生莖葉頗類蒼耳莖葉紋脈竪直梢葉間開花深黃色又有一種苗葉似芥葉而尖狹開花如菊結實頗似鶴蝨科苗味苦性寒有小毒救飢採嫩苗葉煠熟水浸去苦味淘洗淨油鹽調食治病文具本草草部條下澤瀉俗名水䓠菜一名水瀉一名及瀉一名芒芋一名鵠瀉生汝南池澤及齊州山東河陜江淮亦有漢中者為佳今水邊處處有之藂生苗葉其葉似牛舌草葉紋脈竪直葉藂中間攛葶對分莖義莖有線楞梢間開三瓣小白花結實小青細子味甘葉味微鹹俱無毒救飢採嫩葉煠熟水浸淘淨油鹽調食治病文具本草草部條下救荒本草卷一
