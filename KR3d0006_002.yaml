body:
  text: 救荒本草卷二明周王朱橚撰草部葉可食新增八十二種竹節菜一名翠蝴蝶又名翠娥眉又名笪竹花一名倭青草南北皆有今新鄭縣山野中亦有之葉似竹葉微寬短莖淡紅色就地叢生攛節似初生嫩葦節梢葉間開翠碧花狀類蝴蝶其葉味甜救飢採嫩苗葉煠熟油鹽調食獨掃苗生田野中今處處有之葉似竹形而柔弱細小抪音布莖而生莖葉梢間結小青子小如粟粒科莖老時可為掃帚葉味甘救飢採嫩苗葉煠熟水浸淘淨油鹽調食晒乾煠食不破腹尤佳治病今人多將其子亦作地膚子代用歪頭菜出新鄭縣山野中細莖就地叢生葉似豇豆葉而狹長背微白兩葉並生一處開紅紫花結角比豌豆角短小匾瘦葉味甜救飢採葉煠熟油鹽調食兔兒酸一名兔兒漿所在田野中皆有之苗比水葒矮短莖葉皆類水葒其莖節密其葉亦稠比水葒葉稍薄小味酸性寒救飢採苗葉煠熟以新汲水浸去酸味淘淨油鹽調食鹻音減蓬一名鹽蓬生水傍下濕地莖似落䔧亦有線楞葉似蓬而肥壯比蓬葉亦稀踈莖葉間結青子極細小其葉味微鹹性微寒救飢採苗葉煠熟水浸去鹻味淘洗淨油鹽調食䕡蒿田野中處處有之苗高二尺餘莖􅗰似艾其葉細長鋸齒葉抪音布莖而生味微苦性微溫救飢採嫩苗葉煠熟水浸淘淨油鹽調食水萵苣一名水菠菜水邊多生苗高一尺許葉似麥藍葉而有細鋸齒兩葉對生每兩葉間對義又生兩枝梢間開青白花結小青蓇葖如小椒粒大其葉味微苦性寒救飢採苗葉煠熟水淘淨油鹽調食金盞菜一名地冬瓜菜生田野中苗高二三尺莖初微赤而有線路葉似綿栁葉微厚抪莖而生莖葉稠密開花紫色黃心其葉味甘微鹹救飢採苗葉煠熟水淘淨油鹽調食水辣菜生水邊下濕地中苗高一尺餘莖圓葉似雞兒腸葉頭微齊短又似馬蘭頭葉亦更齊短其葉抪莖生梢間出穗如黃蒿穗其葉味辣救飢採嫩苗葉煠熟換水淘去辣氣油鹽調食生亦可食紫雲菜生密縣付家衝山野中苗高一二尺莖方紫色對節生義葉似山小菜葉頗長抪梗對生葉頂及葉間開淡紫花其葉味微苦救飢採嫩苗葉煠熟水浸淘去苦味油鹽調食鴉蔥生田野中葉瓣尖長拓地而生葉似初生薥秣葉而小又似初生大藍葉細窄而尖其葉邊皆曲皺葉中攛葶上結小蓇葖後出白英味微辛救飢採苗葉煠熟油鹽調食匙頭菜生密縣山野中作小科苗其莖面窊五化切背圓葉似團匙頭樣有如杏葉大邊微鋸齒開淡紅花結子黃褐色其葉味甜救飢採葉煠熟水浸淘淨油鹽調食雞冠菜生田野中苗高尺餘葉似青莢菜葉而窄小又似山菜葉而窄􅕏梢間出穗似兔兒尾穗却微細小開粉紅花結實如莧菜子苗葉味苦救飢採苗葉煠熟水浸淘去苦氣油鹽調食水蔓菁一名地膚子生中牟縣南沙岡中苗高一二尺葉倣佛似地瓜兒葉却甚短小捲邊窊靣又似雞兒腸葉頗尖􅕏梢頭出穗開淡藕絲褐花葉味甜救飢採苗葉煠熟油鹽調食治病今人亦將其子作地膚子用野園荽音錐生祥符西北田野中苗高一尺餘苗葉結實皆似家胡荽但細小瘦窄味甜微辛香救飢採嫩苗葉煠熟油鹽調食牛尾菜生輝縣鴉子口山野間苗高二三尺葉似龍鬚菜葉葉間分生義枝及出一細絲蔓又似金剛刺葉而小紋脈皆竪莖葉梢間開白花結子黑色其葉味甘救飢採嫩葉煠熟水浸淘淨油鹽調食山萮菜生密縣山野中苗初拓地生其葉之莖背圓靣窊五化切葉似初出冬蜀葵葉稍小五花義鋸齒邊又似蔚臭苗葉而硬厚頗大後攛莖義莖深紫色梢葉頗小味微辣救飢採苗葉煠熟換水浸淘淨油鹽調食綿絲菜生輝縣山野中苗高一二尺葉似兔兒尾葉但短小又似栁葉菜葉亦比短小梢頭攢生小蓇葖開黲白花其葉味甜救飢採嫩苗葉煠熟水浸淘淨油鹽調食米蒿生田野中所在處處有之苗高尺許葉似園荽葉微細葉叢間分生莖義梢上開小青黃花結小細角似葶藶角兒葉味微苦救飢採嫩苗煠熟水浸過淘淨油鹽調食山芥菜生密縣山坡及岡野中苗高一二尺葉似家芥菜葉瘦短微尖而多花義開小黃花結小短角兒味辣微甜救飢採苗葉揀擇淨煠熟油鹽調食舌頭菜生密縣山野中苗葉拓地生葉似山白菜葉而小頭頗團葉靣不皺比山白菜葉亦厚狀類豬舌形故以為名味苦救飢採葉煠熟水浸去苦味換水淘淨油鹽調食紫香蒿生中牟縣平野中苗高一二尺莖方紫色葉似邪蒿葉而背白又似野胡蘿蔔葉微短莖葉梢間結小青子比灰菜子又小其葉味苦救飢採葉煠熟水浸去苦味油鹽調食金盞兒花人家園圃中多種苗高四五寸葉似初生萵苣葉比萵苣葉狹窄而厚抪音布莖生葉莖端開金黃色盞子樣花其葉味酸救飢採苗葉煠熟水浸去酸味淘淨油鹽調食六月菊生祥符西田野中苗高一二尺莖似鐵桿音杆蒿莖葉似雞兒腸葉但長而澀又似馬蘭頭葉而硬短梢葉間開淡紫花葉味微酸澀救飢採葉煠熟水浸去邪味油鹽調食費菜生輝縣太行山車箱衝山野間苗高尺許葉似火焰草葉而小頭頗齊上有鋸齒其葉抪音布莖而生葉梢上開五瓣小尖淡黃花結五瓣紅小花蒴兒苗葉味酸救飢採嫩苗葉煠熟換水淘去酸味油鹽調食干屈菜生田野中苗高二尺許莖方四楞葉似山梗菜葉而不尖又似栁葉菜葉亦短小葉頭頗齊葉皆相對生梢間開紅紫花葉味甜救飢採嫩苗葉煠熟水浸淘淨油鹽調食栁葉菜生鄭州賈峪音欲山山野中苗高二尺餘莖淡紅色葉似栁葉而厚短有澀毛梢間開四瓣深紅花結細長角兒其葉味甜救飢採苗葉煠熟油鹽調食婆婆指甲菜生田野中作地攤音灘科生莖細弱葉像女人指甲又似初生棗葉微薄細莖梢間結小花蒴苗葉味甘救飢採嫩苗葉煠熟油鹽調食鐵桿蒿生田野中苗莖高二三尺葉似獨掃葉微肥短又似萹蓄葉而短小分生莖義梢間開淡紫花黃心葉味苦救飢採葉煠熟淘去苦味油鹽調食山甜菜生密縣韶華山山谷中苗高二三尺莖青白色葉似初生棉花葉而窄花義頗淺其莖葉間開五瓣淡紫花結子如枸把子生則青熟則紅色葉味苦救飢採葉煠熟換水浸淘去苦味油鹽調食剪刀股音古生田野中處處有之就地作小科苗葉似嫩苦苣葉而細小色頗似藍亦有白汁莖義梢間開淡黃花葉味苦救飢採苗葉煠熟水浸淘去苦味油鹽調食水蘇子生下濕地莖淡紫色對生莖義葉亦對生其葉似地瓜葉而窄邊有花鋸齒三義尖葉下兩傍又有小義葉梢開花深黃色其葉味辛救飢採苗葉煠熟油鹽調食風花菜生田野中苗高二尺餘葉似芥菜葉而瘦長又多花義梢間開黃花如芥菜花味辛微苦救飢採嫩苗葉煠熟換水浸淘去苦味油鹽調食鵝兒腸生許州水澤邊就地妥莖而生對節生葉葉似豌豆葉而薄又似佛指甲葉微􅕏葉間分生枝義開白花結子似葶藶子其葉味甜救飢採苗葉煠熟油鹽調食粉條兒菜生田野中其葉初生就地叢生長則四散分垂葉似萱草葉而瘦細微短葉間攛葶開淡黃花葉味甜救飢採葉煠熟淘洗淨油鹽調食辣辣菜生荒野中今處處有之苗高五七寸初生尖葉後分枝莖上出長葉開細青白花結小匾蒴其子似米蒿子黃色味辣救飢採嫩苗葉煠熟水浸淘淨油鹽調食生揉亦可食毛連菜一名常十八生田野中苗初拓地生後攛莖義高二尺許葉似刺薊葉而長大梢尖其葉邊褗音堰曲皺上有澀毛梢間開銀褐花味微苦救飢採葉煠熟水浸淘淨油鹽調食小桃紅一名鳳仙花一名夾竹桃又名海蒳音納俗名染指甲草人家園圃多種今處處有之苗高二尺許葉似桃葉而窄邊有細鋸齒開紅花結實形類桃樣極小有子似蘿蔔子取之易迸北諍切散俗名急性子葉味苦微澀救飢採苗葉煠熟水浸一宿做菜油鹽調食青莢兒菜生輝縣太行山山野中苗高二尺許對生莖義葉亦對生其葉靣青背白鋸齒三義葉腳葉花義頗大狀似荏子葉而狹長尖􅕏莖葉梢間開五瓣小黃花衆花攢開形如穗狀其葉味微苦救飢採嫩苗葉煠熟換水浸淘去苦味油鹽調食八角菜生輝縣太行山山野中苗高一尺許苗莖甚細其葉狀類牡丹葉而大味甜救飢採嫩苗葉煠熟水浸淘淨油鹽調食耐驚菜一名蓮子草以其花之蓇葖狀似小蓮蓬樣故名生下濕地中苗高一尺餘莖紫赤色對生莖義葉似小桃紅葉而長梢間開細瓣白花而淡黃心葉味苦救飢採苗葉煠熟油鹽調食地棠菜生鄭州南沙岡中苗高一二尺葉似地棠花葉甚大又似初生芥菜葉微狹而尖味甜救飢採嫩苗葉煠熟油鹽調食雞兒腸生中牟田野中苗高一二尺莖黑紫色葉似薄荷葉微小邊有稀鋸齒又似六月菊梢葉間開細瓣淡粉紫花黃心葉味微辣救飢採葉煠熟換水淘去辣味油鹽調食雨點兒菜生田野中就地叢生其莖腳紫稍青葉如細栁葉而窄音側小抪音布莖而生又似石竹子葉而頗硬梢間開小尖五瓣音辦紫花結角比蘿蔔角又大其葉味甘救飢採葉煠熟水浸作過淘洗令淨油鹽調食白屈菜生田野中苗高一二尺初作叢生莖葉皆青白色莖有毛刺梢頭分義上開四瓣黃花葉頗似山芥菜葉而花義極大又似漏蘆葉而色淡味苦微辣救飢採葉和淨土煮熟撈出連土浸一宿换水淘洗淨油鹽調食扯根菜生田野中苗高一尺許莖色赤紅葉似小桃紅葉微窄小色頗緑又似小栁葉亦短而厚窄其葉周圍攢莖而生開碎瓣小青白花結小花蒴似蒺藜樣葉苗味甘救飢採苗葉煠熟水浸淘淨油鹽調食草零陵香又名芫香人家園圃中多種之葉似苜蓿葉而長大微尖莖葉間開小淡粉紫花作小短種其子小如粟粒苗葉味苦性平救飢採苗葉煠熟換水淘淨油鹽調食治病今人遇零陵香缺多以此物代用水落藜生水邊所在處處有之苗高尺餘莖色微紅葉似野灰菜葉而瘦小味微苦澀性涼救飢採苗葉煠熟換水浸淘洗淨油鹽調食晒乾煠食尤好涼蒿菜又名甘菊芽生密縣山野中葉似菊花葉而細長尖􅕏音哨又多花義開黃花其葉味甘救飢採葉煠熟換水浸淘淨油鹽調食粘魚鬚一名龍鬚菜生鄭州賈峪音欲山及新鄭山野中亦有之初先發笋其後延蔓生莖發葉每葉間皆分出一小義又出一絲蔓葉似土茜葉而大又似金剛刺葉亦似牛尾菜葉不澀而光澤味甘救飢採嫩笋葉煠熟油鹽調食節節菜生荒野下濕地科苗甚小葉似鹻音減蓬又更細小而稀踈其莖多節堅硬兀諍切葉間開粉紫花味甜救飢採嫩苗揀擇淨煠熟水浸淘過油鹽調食野艾蒿生田野中苗葉類艾而細又多花義葉有艾香味苦救飢採葉煠熟水淘去苦味油鹽調食堇堇菜一名箭頭草生田野中苗初拓地生葉似鈹音批箭頭樣而葉蒂甚長其後葉間攛葶開紫花結三瓣蒴兒中有子如芥子大茶褐色葉味甘救飢採苗葉煠熟水浸淘淨油鹽調食治病今人傳説根葉搗傳諸腫毒婆婆納生田野中苗拓地生葉最小如小面花黶音掩兒狀類初生菊花芽葉又團邊微花如雲頭樣味甜救飢採苗葉煠熟水浸淘淨油鹽調食野茴香生田野中其苗初拓地生葉似抪音布娘蒿葉微細小後於葉間攛七官切葶分生莖義梢頭開黃花結細角有小黑子葉味苦救飢採苗葉煠熟水浸淘去苦味油鹽調食蠍子花菜又名虼音吃蚤花一名野菠菜生田野中苗初拓地生葉似初生菠菜葉而瘦細葉間攛生莖義高一尺餘莖有線楞梢間開小白花其葉味苦救飢採嫩葉煠熟水淘淨油鹽調食白蒿生荒野中苗高二三尺葉如細絲似初生松針色微青白稍似艾香味微辣救飢採嫩苗葉煠熟換水浸淘淨油鹽調食野同蒿生荒野中苗高二三尺莖紫赤色葉似白蒿色微青苗又似初生松針而茸音戎細味苦救飢採嫩苗葉煠熟換水浸淘淨油鹽調食野粉團兒生田野中苗高一二尺莖似鐵桿音杆蒿莖葉似獨掃葉而小上下稀踈枝頭分義開淡白花黃心味甜辣救飢採嫩苗葉煠熟水浸淘淨油鹽調食蚵蚾菜音軻婆生密縣山野中科苗高二三尺許葉似連翹葉微長又似金銀花葉而尖紋皺却少邊有小鋸齒開粉紫花黃心葉味甜救飢採嫩苗葉煠熟水浸淘洗淨油鹽調食狗掉尾苗生南陽府馬鞍山中苗長二三尺拖蔓而生莖方色青其葉似歪頭菜葉稍大而尖􅕏色深緑紋脈微多又似狗筋蔓葉梢間開五瓣小白花黃心衆花攢開其狀如穗葉味微酸救飢採嫩葉煠熟換水浸去酸味淘淨油鹽調食石芥生輝縣鴉子口山谷中苗高三尺葉似地棠菜葉而闊短每三葉或五葉攢生一處開淡黃花結黑子苗葉味苦微辣救飢採嫩葉煠熟換水浸去苦味油鹽調食獾耳菜音歡生中牟平野中苗長尺餘莖多枝義其莖上有細線楞葉似竹葉而短小亦軟又似萹蓄葉却頗闊大而又尖莖葉俱有微毛開小黲白花結細灰青子苗葉味甘救飢採嫩苗葉煠熟水浸淘淨油鹽調食回回蒜一名水胡椒又名蠍虎草生水邊下濕地苗高一尺許葉似野艾蒿而硬又甚花義又似前胡葉頗大亦多花義苗莖梢頭開五瓣黃花結穗如初生桑椹子而小又似初生蒼耳實亦小色青味極辛辣其葉味甜救飢採葉煠熟换水浸淘淨油鹽調食子可搗爛調菜用地槐菜一名小蟲兒麥生荒野中苗高四五寸葉似石竹子葉極細短開小黃白花結小黑子其葉味甜救飢採葉煠熟水浸淘淨油鹽調食螺黶兒音羅掩一名地桑又名痢見草生荒野中莖微紅葉似野人莧葉微長窄而尖開花作赤色小細穗兒其葉味甘救飢採苗葉煠熟水浸淘去邪味油鹽調食治病今人傳説治痢疾採苗用水煮服甚效泥胡菜生田野中苗高一二尺莖梗繁多葉似水芥菜葉頗大花義甚深又似風花菜葉却比短小葉中攛葶分生莖義梢間開淡紫花似刺薊花苗葉味辣救飢採嫩苗葉煠熟水浸淘淨油鹽調食兔兒絲生田野中其苗就地拖蔓節間生葉如指頂大葉邊似雲頭樣開小黃花苗葉味甜救飢採嫩苗葉煠熟水浸淘淨油鹽調食老鸛筋生田野中就地拖棘而生莖微紫色莖義繁稠葉似園荽葉而頭不尖又似野胡蘿蔔葉而短小葉間開五瓣小黃花味甜救飢採嫩苗葉煠熟水浸去邪味淘洗淨油鹽調食絞股藍生田野中延蔓而生葉似小藍葉短小軟薄邊有鋸齒又似痢見草葉亦軟淡緑五葉攢生一處開小黃花又有開白花者結子如豌豆大生則青色熟則紫黑色葉味甜救飢採葉煠熟水浸去邪味涎沫淘洗淨油鹽調食山梗菜生鄭州賈峪音欲山山野中苗高二尺許莖淡紫色葉似桃葉而短小又似栁葉菜葉亦小梢間開淡紫花其葉味甜救飢採嫩葉煠熟淘洗淨油鹽調食抪音布娘蒿生田野中苗高二尺許莖似黃蒿莖其葉碎有茸細如針色頗黃緑嫩則可食老則為柴苗葉味苦救飢採嫩苗葉煠熟換水浸淘去蒿氣油鹽調食雞腸菜生南陽府馬鞍山荒野中苗高二尺許莖方色紫其葉對生葉似菱葉樣而無花義又似小灰菜葉形樣微匾開粉紅花結碗子蒴兒葉味甜救飢採苗葉煠熟水淘淨油鹽調食水葫蘆苗生水邊就地拖蔓而生每節間生四葉而葉如指頂大其葉尖上皆作三義味甘救飢採葉連嫩秧煠熟水浸淘淨油鹽調食胡蒼耳又名回回蒼耳生田野中葉似皂莢葉微長大又似望江南葉而小頗硬色微淡緑莖有線楞結實如蒼耳實但長􅕏音哨味微苦救飢採嫩苗葉煠熟水浸去苦味淘淨油鹽調食治病今人傳説治諸般瘡採葉用好酒熬喫消腫水棘針苗又名山油子生田野中苗高一二尺莖方四楞對分莖義葉亦對生其葉似荆葉而軟鋸齒尖葉莖葉紫緑開小紫碧花葉味辛辣微甜性溫救飢採苗葉煠熟水淘洗淨油鹽調食沙蓬又名雞爪菜生田野中苗高一尺餘初就地婆娑生後分莖義其莖有細線楞葉似獨掃葉狹窄而厚又似石竹子葉亦窄莖葉梢間結小青子小如粟粒其葉味甘性溫救飢採苗葉煠熟水浸淘淨油鹽調食麥藍菜生田野中莖葉俱深萵苣色葉似大藍梢葉而小頗尖其葉抱莖對生每一葉間攛生一義莖義梢頭開小肉紅花結蒴有子似小桃紅子苗葉味微苦救飢採嫩苗葉煠熟水浸淘淨油鹽調食女婁菜生密縣韶華山山谷中苗高一二尺莖義相對分生葉似旋覆花葉頗短色微深緑抪莖對生梢間出青蓇葖開花微吐白蘂結實青子如枸把微小其葉味苦救飢採嫩苗葉煠熟換水浸去苦味淘淨油鹽調食委陵菜一名翻白菜生田野中苗初拓地生後分莖叉莖節稠密上有白毛葉倣佛類柏葉而極闊大邊如鋸齒形靣青背白又似雞腿兒葉而却窄又類鹿蕨葉亦窄莖葉梢間開五瓣黃花其葉味苦微辣救飢採苗葉煠熟水浸淘淨油鹽調食獨行菜又名麥秸菜生田野中科苗高一尺許葉似水棘針葉微短小又似水蘇子葉亦短小狹窄作瓦隴樣梢出細葶開小黲白花結小青蓇葖小如菉豆粒葉味甜性溫救飢採嫩苗葉煠熟换水淘淨油鹽調食山蓼生密縣山野間苗高一二尺葉似芍藥葉而長細窄音側又似野菊花葉而硬厚又似水胡椒葉亦硬開碎瓣白花其葉味微辣救飢採嫩葉煠熟換水浸去辣氣作成黃色淘洗淨油鹽調食救荒本草卷二
