body:
  text: 救荒本草卷四明周王朱橚撰草部實可食本草原有四種新增十六種葉及實皆可食本草原有六種新增六種根葉可食本草原有四種新增七種笋葉可食本草原有三種根及花皆可食本草原有二種根及實皆可食本草原有一種新増一種花葉皆可食本草原有二種新増二種莖可食本草原有一種新増一種笋及實皆可食本草原有一種雀麥本草一名鷰麥一名蘥音藥生於荒野林下今處處有之苗似鷰麥而又細弱結穗像麥穗而極細小每穗又分作小义穗十數箇子甚細小味甘性平無毒救飢採子舂去皮搗作麵蒸食作餅食亦可治病文具本草草部條下回回米本草名苡薏仁一名解蠡音离一名屋菼音毯一名起實一名􅀢音紺俗名草珠兒又呼為西番薥秫音蜀述生真定平澤及田野交趾生者子最大彼土人呼為􅀢珠今處處有之苗高三四尺葉似黍葉而稍大開紅白花作穗子結實青白色形如珠而梢長故名薏珠子味甘微寒無毒今人俗亦呼為菩提子救飢採實舂取其中仁煮粥食取葉煮飲亦香治病文具本草草部苡薏仁條下蒺䔧子本草一名旁通一名屈人一名止行一名犲音柴羽一名升推一名即䔧一名茨生馮翊平澤或道傍今處處有之布地蔓生細葉開小黄花結子有三角刺人是也性苦辛性温微寒無毒烏頭為之使又有一種白蒺䔧出同州沙苑開黄紫花作莢子結子狀如腰子様小如黍粒補腎藥多用味甘有小毒救飢收子炒微黄搗去刺磨麵作燒餅或蒸食皆可治病文具本草草部條下檾子本草名苘與檾同實處處有之北人種以打繩索苗高五六尺葉似芋葉而短薄微有毛澁開金黄花結實殻似蜀葵實殻而圓大俗呼為檾饅頭子黑色如􅀈豆大味苦性平無毒救飢採嫩檾饅頭取子生食子堅實時收取子浸去苦味晒乾磨麵食治病文具本草草部苘實條下稗子有二種水稗生水田邊旱稗生田野中今皆處處有之苗葉似穇子葉色深緑脚葉頗帶紫色梢頭出匾穗結子如黍粒大茶褐色味微苦性微温救飢採子搗米煮粥食蒸食尤佳或磨作麵食皆可穇子生水田中及下濕地内苗葉似稻但差短梢頭結穗彷彿稗子穗其子如黍粒大茶褐色味甘救飢採子搗米煮粥或磨作麵蒸食亦可川穀生汜水縣田野中苗高三四尺葉似初生薥秫音蜀述葉微小葉間叢開小黄白花結子似草珠兒微小味甘救飢採子搗為米生用冷水淘淨後以滚水湯三五次去水下鍋或作粥或作炊飯食皆可并堪造酒莠草子生田野中苗葉似榖而葉微痩梢間結茸音戎細毛穗其子比穀細小舂米類折米熟時即收不收即落味微苦性温救飢採莠穗揉音柔取子搗米作粥或作水飯皆可食野黍生荒野中科苗皆類家黍而莖葉細弱穗甚痩小黍粒亦極細小味甜性微温救飢採子舂音冲去粗糠或搗或磨麵蒸糕食甚甜雞眼草又名搯音恰不齊以其葉用指甲搯之作劐音霍不齊故名生荒野中搨地生葉如雞眼大似三葉酸漿葉而圓又似小蟲兒卧草葉而大結子小如粟粒黒茶褐色味微苦氣味與槐相類性温救飢採子搗取米其米青色先用冷水淘淨却以滚水湯三五次去水下鍋或煮粥或作炊飯食之或磨麵作餅食亦可鷰麥田野處處有之其苗似麥攛七官切葶但細弱葉亦痩細抪音布莖而生結細長穗其麥粒極細小味甘救飢採子舂去皮搗磨為麵食潑盤一名杔盤生汝南荒野中陳蔡間多有之苗高五七寸莖葉有小刺其葉彷彿似艾葉稍團葉背亦白每三葉攢生一處結子作穗如半柿大類小盤堆石榴顆狀下有蔕承如柿蔕形味甘酸性温救飢以撥盤顆粒紅熟時採食之彼土人取以當果絲瓜苗人家園籬邊多種之延蔓而生葉似栝樓葉而花义大每葉間出一絲藤纒附草木上莖葉間開五瓣大黄花結瓜形如黄瓜而大色青嫩時可食老則去皮内有絲縷可以擦洗油膩器皿味微甜救飢採嫩瓜切碎煠熟水浸淘淨油鹽調食地角兒苗一名地牛兒苗生田野中搨地生一根就分數十莖其莖甚稠葉似胡豆葉微小葉生莖面每攢四葉對生作一處莖傍另又生葶梢頭開淡紫花結角似連翹而小中有子狀似􅀈豆顆味甘救飢採嫩角生食硬角煮熟食馬㼎兒音雹生田野中就地拖秧而生葉似甜瓜葉極小莖蔓亦細開黄花結實比雞彈微小味微酸救飢摘取馬㼎熟者食之山黧豆一名山豌豆生密縣山野中苗高尺許其莖窊面劒脊葉似竹葉而齊短兩兩對生開淡紫花結小角兒其豆匾如􅀈豆味甜救飢採取角兒煮食或打取豆食皆可龍芽草一名瓜香草生輝縣鴨子口山野間苗髙一尺餘莖多澁毛葉形如地棠葉而寛大葉頭齊團每五葉或七葉作一莖排生葉莖脚上又有小芽葉兩兩對生梢間出穗開五瓣小圓黄花結青毛蓇葖有子大如黍粒味甜救飢収取其子或搗或磨作麵食之地稍瓜生田野中苗長尺許作地攤科生葉似獨掃葉而細窄尖硬又似沙蓬葉亦硬週圍攅莖而生莖葉間開小白花結角長大如蓮子兩頭尖􅕏音峭又似鴉嘴形名地稍瓜味甘救飢其角嫩時摘取煠食角若皮硬剝取角中嫩穰生食錦荔技又名癩葡萄人家園籬邊多種之苗引藤蔓延附草木生莖長七八尺莖有毛澁葉似野葡萄葉而花叉多葉間生細絲蔓開五瓣黄碗子花結實如雞子大尖􅕏紋縐狀似荔枝而大生青熟黄内有紅瓤味甜救飢採荔枝黄熟者食瓤雞冠果一名野楊梅生密縣山谷中苗髙五七寸葉似潑盤葉而小又似雞兒頭葉微團開五瓣黄花結實似紅小楊梅狀味甜酸救飢採取其果紅熟者食之羊蹄苗一名東方宿一名連蟲陸一名鬼目一名蓄俗呼猪耳朶生陳留川澤今所在有之苗初搨地生後攛生莖义髙二尺餘其葉狹長頗似萵苣而色深青又似大藍葉微濶莖節間紫赤色其花青白成穗其子三稜根似牛蒡而堅實味苦性寒無毒救飢採嫩苗葉煠熟水浸淘淨苦味油鹽調食其子熟時打子搗為米以滚水湯三五次淘淨下鍋作水飯食微破腹治病文具本草草部條下蒼耳本草名葈音徙耳俗名道人頭又名喝起草一名胡葈一名地葵一名葹音詩一名常思一名羊負來詩謂之卷耳爾雅謂之苓耳生安陸川谷及六安田野今處處有之葉青白類粘糊菜葉莖葉秋間結實比桑椹短小而多刺其實味苦甘性温葉味苦辛性微寒有小毒又云無毒救飢採嫩苗葉煠熟換水浸去苦味淘淨油鹽調食其子炒微黄搗去皮磨為麵作燒餅蒸食亦可或用子熬油㸃燈治病文具本草草部葈耳條下姑娘菜俗名燈籠兒又名掛金燈本草名酸漿一名醋漿生荆楚川澤及人家田園中今處處有之苗髙一尺餘苗似水莨而小葉似天茄兒葉窄小又似人莧葉頗大而尖開白花結房如囊似野西瓜蒴形如撮口布袋又類燈籠様囊中有實如櫻桃大赤黄色味酸性平寒無毒葉味微苦别條又有一種三葉酸漿草與此不同治證亦别救飢採葉煠熟水浸淘去苦味油鹽調食子熟摘取食之治病文具本草草部酸漿條下土茜苗本草根名茜根一名地血一名茹蘆音閭一名茅蒐音搜一名蒨與茜同生喬山川谷徐州人謂之牛蔓西土出者佳今北土處處有之名土茜根可以染紅葉似棗葉形頭尖下闊紋脉竪直莖方莖葉俱澁四五葉對生節間莖蔓延附草木開五瓣淡銀褐花結子小如菉豆粒生青熟紅根紫赤色味苦性寒無毒一云味甘一云味酸畏鼠姑葉味微酸救飢採葉煠熟水浸作成黄色淘淨油鹽調食其子紅熟摘食治病文具本草草部茜根條下王不留行又名剪金草一名禁宫花一名剪金花生太山山谷今祥符沙堈間亦有之苗髙一尺餘其莖對節生义葉似石竹子葉而寛短抪莖對生脚葉似槐葉而狹長開粉紅花結蒴如松子大似罌粟殻様極小有子如葶藶子大而黑色味苦甘性平無毒救飢採嫩葉煠熟換水淘去苦味油鹽調食子可搗為麵食治病文具本草草部條下白薇一名白幕一名薇草一名春草一名骨美生平原川谷并陜西諸郡及滁州今鈞州密縣山野中亦有之苗髙一二尺莖葉俱青頗類栁葉而闊短又似女婁脚葉而長硬毛澁開花紅色又云紫花結角似地稍瓜而大中有白瓤根狀如牛膝根而短黄白色味苦鹹性平大寒無毒惡黄耆大黄大㦸乾薑乾漆山茱萸大棗救飢採嫩葉煠熟水浸淘淨油鹽調食并取嫩角煠熟亦可食治病文具本草草部條下蓬子菜生田野中所在處處有之其苗嫩時莖有紅紫線楞葉似鹻音減蓬葉微細苗老結子葉則生出义刺其子如獨掃子大苗葉味甜救飢採嫩苗葉煠熟水浸淘淨油鹽調食晒乾煠食尤佳及採子搗米青色或煮粥或磨麵作餅蒸食皆可胡枝子俗亦名隨軍茶生平澤中有二種葉形有大小大葉者類黑豆葉小葉者莖類蓍草葉似苜蓿葉而長大花色有紫白結子如粟粒大氣味與槐相類性温救飢採子微舂即成米先用冷水淘淨復以滚水湯三五次去水下鍋或作粥或作炊飯皆可食加野菉豆味尤佳及採嫩葉蒸晒為茶煮飲亦可米布袋生田野中苗搨地生葉似澤漆葉而窄其葉順莖排生梢頭措結三四角中有子如黍粒大微匾味甜救飢採角取子水淘洗淨下鍋煮食其嫩苗葉煠熟油鹽調食亦可水慈菰俗呼為剪刀草又名箭搭草生水中其莖面窊背方背有線楞其葉三角似剪刀形葉中攛生莖义梢間開三瓣白花黄心結青蓇葖如青楮桃狀頗小根類葱根而麄大其味甜救飢採近根嫩笋莖煠熟油鹽調食天茄兒苗生田野中苗髙二尺許莖有線楞葉似姑娘草葉而大又似和尚菜葉却小開五瓣小白花結子似野葡萄大紫黑色味甜救飢採嫩葉煠熟水浸去邪味淘淨油鹽調食其子熟時亦可摘食治病今人傳說採葉傅貼腫毒金瘡拔毒苦馬豆俗名羊尿胞生延津縣郊野中在處亦有之苗髙二尺許莖似黄耆苗莖上有細毛葉似胡豆葉微小又似蒺䔧葉却大枝葉間開紅紫花結殻如拇指項大中間多虛俗呼為羊尿胞内有子如檾音頃子大茶褐色子葉俱味苦救飢採葉煠熟換水浸去苦味淘淨油鹽調食及取子水浸淘去苦味晒乾或磨或搗為麵作燒餅蒸食皆可猪尾把苗一名狗脚莱生荒野中苗長尺餘葉似甘露兒葉而甚短小其頭頗齊莖葉皆有細毛每葉間順條開小白花結小蒴兒中有子小如粟粒黒色苗葉味甜救飢採嫩葉煠熟換水浸淘淨油鹽調食子可搗為麵食黄精苗俗名筆管菜一名重樓一名菟竹一名雞格一名救窮一名鹿竹一名萎㽔一名仙人餘糧一名垂珠一名馬箭一名白及生山谷南北皆有之嵩山茅山者佳根生肥地者大如拳薄地者猶如拇指葉似竹葉或兩葉或三葉或四五葉俱皆對節而生味甘性平無毒又云莖光滑者謂之太陽之草名曰黄精食之可以長生其葉不對節莖葉毛鈎子者謂之太隂之草名曰鉤吻食之入口立死又云莖不紫花不黄為異救飢採嫩葉煠熟換水浸去苦味淘洗淨油鹽調食山中人採根九蒸九暴食甚甘美其蒸暴用瓮去底安釡上裝置黄精令滿密葢蒸之令氣溜即暴之如此九蒸九暴令極熟若不熟則刺人喉咽久食長生辟榖其生者若初服只可一寸半漸漸增之十日不食他食能長服之止三尺服三百日後盡見鬼神餌必升天又云花實極可食罕得見至難得治病文具本草草部條下地黄苗俗名婆婆妳一名地髓一名芐音户一名芑音杞生咸陽川澤今處處有之苗初搨地生葉如山白菜葉而毛澁葉面深青色又似芥菜葉而不花义比芥菜葉頗厚葉中攛莖上有細毛莖梢開筒子花紅黄色北人謂之牛妳子花結實如小麥粒根長四五寸細如手指皮赤黄色味甘苦性寒無毒惡貝母畏蕪荑得麥門冬清酒良忌鐵器救飢採葉煮羮食或搗絞根汁搜麵作䬪飥及冷淘食之或取根浸洗淨九蒸九暴任意服食或煎以為煎食久服輕身不老變白延年治病文具本草草部條下牛旁子本草名惡實未去蕚名鼠粘子俗名夜义頭根謂之牛菜生魯山平澤今處處有之苗髙二三尺葉如芋葉長大而澁花淡紫色實似葡萄而褐色外殻如栗捄而小多刺鼠過之則綴惹不可脫故名殻中有子如半麥粒而匾小根長尺餘麄如拇指其色灰黲味辛性平一云味甘無毒救飢採苗葉煠熟水浸去邪氣淘洗淨油鹽調食及取根水浸洗淨煮熟食之久食甚益人身輕耐老治病文具本草草部惡實條下逺志一名棘菀一名葽音腰繞一名細草生太山及寃句川谷河陜商齊泗州亦有俗傳夷門逺志最佳今密縣梁家衝山谷間多有之苗名小草葉似石竹子葉又極細開小紫花亦有開紅白花者根黄色形如蒿根長及一尺許亦有根黑色者根葉俱味苦性温無毒得茯苓冬葵子龍骨良殺天雄附子毒畏珍珠藜蘆蜚蠊齊蛤蠐螬救飢採嫩苗葉煠熟換水浸去苦味淘淨油鹽調食及掘取根換水煮浸淘去苦味去心再換水煮極熟食之不去心令人心悶治病文具本草草部條下杏葉沙參一名白麵根生密縣山野中苗髙一二尺莖色青白葉似杏葉而小邊有义牙又似山小菜葉微尖而背白梢間開五瓣白碗子花根形如野胡蘿蔔頗肥皮色灰黲中間白色味甜性微寒本草有沙參苗葉根莖其說與此形狀皆不同未敢併入條下乃另開於此其杏葉沙參又有開碧色花者救飢採苗葉煠熟水浸淘淨油鹽調食掘根換水煮食亦佳治病與本草草部下沙參同用藤長苗又名旋菜生密縣山坡中拖蔓而生苗長三四尺餘莖有細毛葉似滴滴金葉而窄小頭頗齊開五瓣粉紅大花根似打碗花根根葉皆味甜救飢採嫩苗葉煠熟水淘淨油鹽調食掘根換水煮熟亦可食牛皮消生密縣山野中拖蔓而生藤蔓長四五尺葉似馬兠鈴葉寛大而薄又似何首烏葉亦寛大開白花結小角兒根類葛根而細小皮黒肉白味苦救飢採葉煠熟水浸去苦味油鹽調食及取根去黑皮切作片換水煮去苦味淘洗淨再以水煮極熟食之菹草上音鮓即水藻也生陂塘及水泊中莖如麄線長三四尺葉形似栁葉而狹長故名栁葉菹又有葉似蓬子葉者根麄如釵股而色白味微鹹性微寒救飢撈取莖葉連嫩根揀擇洗淘潔淨剉碎煠熟油鹽調食或加少米煮粥食尤佳水豆兒一名葳菜生陂塘水澤中其莖葉比菹草又細状類細線連綿不絶根如釵股而色白根下有豆如退皮菉豆瓣味甜救飢採秧及根豆擇洗潔淨煮食生醃食亦可草三奈生密縣梁家衝山谷中苗髙一尺許葉似蓑草而狹長開小淡紅花根似雞爪形而麄亦香其味甘微辛救飢採根換水煮食近根嫩白袴葉亦可煠食水葱生水邊及淺水中科苗彷彿類家葱而極細長梢頭結蓇葖彷彿類葱蓇葖而小開黲白花其根類葱根皮色紫黒根苗俱味甘微鹹救飢採嫩苗連根揀擇洗淨煠熟水浸淘淨油鹽調食蒲笋本草名其苗為香蒲即甘蒲也一名睢一名醮俚俗名此蒲為香蒲謂菖蒲為臭蒲其香蒲水邊處處有之根比菖蒲根極肥大而少節其葉初未出水時葉莖紅白色採以為笋後攛梗於叢葉中花抱梗端如武士捧杵故俚俗謂蒲棒蒲黄即花公蘂屑也細若金粉當欲開時有便取之市㕓間亦採之以蜜捜作果食貨賣甚益小兒味甘性平無毒救飢採近根白笋揀剝洗淨煠熟油鹽調食蒸食亦可或採根刮去麄皴七倫切晒乾磨麵打餅蒸食皆可治病文具本草草部香蒲及蒲黄條下蘆笋其苗名葦子草本草有蘆根爾雅謂之葭菙上音佳下是䅜切生下濕陂澤中其狀都似竹但差小而葉抱莖生無枝义花白作穗如茅花根如竹根亦差小而節疎露出浮水者不堪用味甘一云甘辛性寒救飢採嫩笋煠熟油鹽調食其根甘甜亦可生咂食之治病文具本草草部蘆根條下茅芽根本草名茅根一名蘭根一名茹根一名地菅音奸一名地筋一名兼杜又名白茅菅其芽一名茅針生楚地山谷今田野處處有之春初生苗布地如針夏生白花茸茸然至秋而枯其根至潔白亦甚甘美根性寒茅針性平花性温俱味甘無毒救飢採嫩芽剥取嫩穰食甚益小兒及取根咂食甜味久服利人服食此可斷穀治病文具本草草部茅根條下葛根一名雞齊根一名鹿藿一名黄斤生汶山川谷及成州海州浙江并澧鼎之間今處處有之苗引藤蔓長二三丈莖淡紫色葉頗似楸葉而小色青開花似豌豆花粉紫色結實如皂筴而小根形如手臂味甘性平無毒一云性冷殺野葛巴豆百藥毒救飢掘取根入土深者水浸洗淨蒸食之或以水中揉出粉澄濾成塊蒸煮皆可食及採花晒乾煠食亦可治病文具本草草部條下何首烏一名野苗一名交藤一名夜合一名地精一名陳知白又名桃栁藤亦名九真藤出順州南河縣其嶺外江南許州及䖍州皆有以西洛嵩山歸徳柘城縣者為勝今鈞州密縣山谷中亦有之蔓延而生莖蔓紫色葉似山藥葉而不光嫩葉間開黄白花似葛勒花結子有稜似蕎麥而極細小如粟粒大根大者如拳各有五楞瓣狀似甜瓜様中有花紋形如鳥獸山嶽之狀者極珍有赤白二種赤者雄白者雌又云雄者苗葉黄白雌者赤黄色一云雄苗赤生必相對逺不過三四尺夜則苗蔓相交或隠化不見凡修合藥須雌雄相合服有驗宜偶日服二四六八日是也其藥本無名因何首烏見藤夜交採服有功因以採人為名耳又云其為仙草五十年者如拳大號山奴服之一年髭髮烏黑一百年如碗大號山哥服之一年顔色紅悅百五十年如盆大號山伯服之一年齒落重生二百年如斗栲栳大號山翁服之一年顔如童子行及奔馬三百年如三斗栲栳大號山精服之一年延齡純陽之體久服成地仙又云其頭九數者服之乃仙味苦澁性微温無毒一云味甘茯苓為之使酒下最良忌鐵器猪羊血及猪肉無鱗魚與蘿蔔相惡若並食令人髭鬢早白腸風多熱救飢掘根洗去泥土以苦竹刀切作片米泔浸經宿換水煮去苦味再以水淘洗淨或蒸或煮食之花亦可煠食治病文具本草草部條下瓜樓根俗名天花粉本草有栝樓實一名地樓一名果臝音裸一名天瓜一名澤姑一名黄瓜生𢎞農川谷及山隂地今處處有之入土深者良生鹵地者有毒詩所謂果蓏音裸之實是也根亦名白藥大者細如手臂皮黄肉白苗引藤蔓葉似甜瓜葉而窄花义有細毛開花似葫蘆花淡黄色實在花下大如拳生青熟黄根味苦性寒無毒枸杞為之使惡乾薑畏牛膝乾漆反烏頭救飢採根削皮至白處寸切之水浸一日一次換水浸經四五日取出爛搗研以絹袋盛之澄濾令極細如粉或將根晒乾搗為麵水浸澄濾二十餘遍使極膩如粉或為燒餅或作煎餅切細麵皆可食採栝樓穰煮粥食極甘取子炒乾搗爛用水熬油用亦可治病文具本草草部栝樓條下磚子苗一名闗子苗生水邊苗似水葱而麄大内實又似蒲葶梢開碎白花結穗似水莎草穗紫赤色其子如黍粒大根似蒲根而堅實味甜子味亦甜救飢採子磨麵食及採根擇洗淨換水煮食或晒乾磨為麵食亦可菊花一名節華一名日精一名女節一名女華一名女莖一名更生一名周盈一名𫝊延年一名隂成生雍州川澤及鄧衡齊州田野今處處有之味苦甘性平無毒术枸杞桑根白皮為之使救飢取莖紫氣香而味甘者採葉煠食或作羮皆可青莖而大氣味作蒿苦者不堪食名苦薏其花亦可煠食或炒茶食治病文具本草草部條下金銀花本草名忍冬一名鷺鷥藤一名左纒藤一名金釵股又名老翁鬚亦名忍冬藤舊不載所出州土今輝縣山野中亦有之其藤凌冬不凋故名忍冬草附樹延蔓而生莖微紫色對節生葉葉似薜荔葉而青又似水茶臼葉頭微團而軟背頗澁又似黒豆葉而大開花五出微香蔕帶紅色花初開白色經一二日則色黄故名金銀花本草中不言善治癰疽發背近代名人用之竒效味甘性温無毒救飢採花煠熟油鹽調食及採嫩葉換水煮熟浸去邪氣淘淨油鹽調食治病文具外科精要及本草草部忍冬條下望江南其花名茶花兒人家園圃中多種苗髙二尺許莖微淡赤色葉似槐葉而肥大微尖又似胡蒼耳葉頗大及似皂角葉亦大開五瓣金黄花結角長三寸許葉味微苦救飢採嫩苗葉煠熟水浸淘去苦味油鹽調食花可炒食亦可煠食治病今人多將其子作草决明子代用大蓼生密縣梁家衝山谷中拖藤而生莖有線楞而頗硬對節分生莖义葉亦對生葉似山蓼葉微短而拳曲節間開白花其葉味苦微辣救飢採葉煠熟換水浸去辣味作成黄色淘洗淨油鹽調食花亦可煠食黑三稜舊云河陜江淮荆襄間皆有之今鄭州賈峪山澗水邊亦有苗髙三四尺葉似菖蒲葉而厚大背皆三稜劒脊葉中攛葶葶上結實攅為刺毬狀如楮桃様而大顆瓣甚多其顆瓣形似草决明子而大生則青熟則紅黄色根狀如烏梅而頗大有鬚蔓延相連比京三稜體微輕治療並同其葶味甜根味苦性平無毒救飢採嫩葶剝去麄皮煠熟油鹽調食治病文具本草草部京三稜條下荇絲菜又名金蓮兒一名藕蔬菜水中拖蔓而生葉似初生小荷葉近莖有椏劐音鴉霍葉浮水上葉中攛莖上開金黄花莖味甜救飢採嫩莖煠熟油鹽調食茭笋本草有菰根又名菰蔣草江南人呼為茭草俗又呼為茭白生江東池澤水中及岸際今在處水澤邊皆有之苗髙二三尺葉似蔗荻又似茭葉而長大濶厚葉間攛葶開花如葦結實青子根肥剥取嫩白笋可噉久根盤厚生菌音窘細嫩亦可噉名菰菜三年已上心中生葶如藕白軟中有黑脈甚堪噉名菰首味甘性大寒無毒救飢採茭菰笋煠熟油鹽調食或採子舂為米合粟煮粥食之甚濟飢治病文具本草草部菰根條下救荒本草卷四
