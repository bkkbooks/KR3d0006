body:
  text: 救荒本草卷三明周王朱橚撰草部葉可食新增四十二種根可食本草原有九種新増十五種花蒿生荒野中苗葉就地叢生葉長三四寸四散分垂葉似獨掃葉而長硬其頭頗齊微有毛澁味微辛救飢採葉煠熟水浸淘淨油鹽調食葛公菜生密縣韶華山山谷間苗高二三尺莖方窊面四楞對分莖叉葉亦對生葉似蘇子葉而小又似荏子葉而大梢間開粉紅花結子如小米粒而茶褐色味甜微苦救飢採葉煠熟水浸去苦味換水淘淨油鹽調食鯽魚鱗生密縣韶華山山野中苗高一二尺莖方而茶褐色對分莖叉葉亦對生葉似雞腸菜葉頗大又似桔梗葉而微軟薄葉面却微紋皺梢間開粉紅花結子如小粟粒而茶褐色其葉味甜救飢採葉煠熟水浸淘淨油鹽調食尖刀兒苗生密縣梁家衝山野中苗高二三尺葉似細柳葉更又細長而尖葉皆兩兩抪音布莖對生葉間開淡黄花結尖角兒長二寸許麄如蘿蔔角中有白穰及小匾黒子其葉味甘救飢採葉煠熟水淘洗淨油鹽調食珍珠菜生密縣山野中苗高二尺許莖似蒿稈微帶紅色其葉狀似栁葉而極細小又似地梢瓜葉梢頭出穗狀類鼠尾草穗開白花結子小如菉豆粒黄褐色葉味苦澁救飢採葉煠熟換水浸去澁味淘淨油鹽調食杜當歸生密縣山野中苗高一尺許莖圓而有線楞葉似山芹菜葉而硬邊有細鋸齒刺又似蒼术葉而大每三葉攢生一處開黄花根似前胡根又似野胡蘿蔔根其葉味甜救飢採葉煠熟水浸作成黄色換水淘洗淨油鹽調食治病今人遇當歸缺以此藥代之風輪菜生密縣山野中苗高二尺餘方莖四楞色淡緑微白葉似荏子葉而小又似威靈仙葉微寛邊有鋸齒叉兩葉對生而葉節間又生子葉極小四葉相攢對生開淡粉紅花其葉味苦救飢採葉煠熟水浸去邪味淘洗淨油鹽調食拖白練苗生田野中苗搨地生葉似垂盆草葉而又小葉間開小白花結細黄子其葉味甜救飢採苗葉煠熟油鹽調食透骨草一名天芝麻生中牟荒野中苗高三四尺莖方窊面四楞其莖脚紫對節分生莖叉葉似䕡蒿葉而多花叉葉皆對生莖節間攢開粉紅花結子似胡麻子葉味苦救飢採嫩苗葉煠熟水浸去苦味淘淨油鹽調食治病今人傳說採苗搗傅腫毒酸桶笋生密縣韶華山山澗邊初發笋葉其後分生莖叉科苗高四五尺莖稈似水葒莖而紅赤色其葉似白槿葉而澁又似山格刺菜葉亦澁紋脈亦麄味甘微酸救飢採嫩笋葉煠熟水浸去邪味淘淨油鹽調食鹿蕨菜生輝縣山野中苗高一尺許其葉之莖背圓而面窊五化切葉似紫香蒿脚葉而肥濶頗硬又似胡蘿蔔葉亦肥硬味甜救飢採苗葉煠熟水浸淘淨油鹽調食山芹菜生輝縣山野間苗高一尺餘葉似野蜀葵葉稍大而有五叉又似地牡丹葉亦大葉中攛生莖叉梢結刺毬如鼠粘子刺毬而小開花黲白色葉味甘救飢採苗葉煠熟水浸淘淨油鹽調食金剛刺又名老君鬚生輝縣鴉子口山野間科條高三四尺條似刺䕷音梅花條其上多刺葉似牛尾菜葉又似龍鬚菜葉比此二葉俱大葉間生細絲蔓其葉味甘救飢採葉煠熟水浸淘淨油鹽調食栁葉青生中牟荒野中科苗高二尺餘莖似蒿莖葉似栁葉而短抪音布莖而生開小白花銀褐心其葉味微辛救飢採嫩葉煠熟水浸淘淨油鹽調食大蓬蒿生密縣山野中莖似黄蒿莖色微帶紫葉似山芥菜葉而長尖極多花叉又似風花菜葉花叉亦多又似漏蘆葉却微短開碎瓣黄花苗葉味苦救飢採葉煠熟水浸淘去苦味油鹽調食狗筋蔓生中牟縣沙崗間小科就地拖蔓生葉似狗掉尾葉而短小又似月芽菜葉微尖􅕏而軟亦多紋脉兩葉對生葉梢間開白花其葉味苦救飢採葉煠熟水浸淘去苦味油鹽調食兒傘生滎陽塔兒山荒野中其苗高二三尺許每科初生一莖莖端生葉一層有七八葉每葉分作四叉排生如傘葢狀故以為名後於葉間攛生莖叉上開淡紅白花根似牛膝而踈短味苦微辛救飢採嫩葉煠熟換水浸淘去苦味油鹽調食地花菜又名墓頭灰生密縣山野中苗高尺餘葉似野菊花葉而窄細又似鼠尾草葉亦痩細梢葉間開五瓣小黄花其葉味微苦救飢採葉煠熟水浸淘洗淨油鹽調食杓兒菜生密縣山野中苗高一二尺葉類狗掉尾葉而窄頗長黑緑色微有毛澁又似耐驚菜葉而小軟薄梢葉更小開碎瓣淡黄白花其葉味苦救飢採葉煠熟水浸去苦味淘洗淨油鹽調食佛指甲生密縣山谷中科苗高一二尺莖微帶赤黄色其葉淡緑背皆微帶白色葉如長匙頭様似黑豆葉而微寛又似鵝兒腸葉甚大皆兩葉對生開黄花結實形如連翹微小中有黑子小如粟粒其葉味甜救飢採嫩葉煠熟換水淘洗淨油鹽調食虎尾草生密縣山谷中科苗高二三尺莖圓葉頗似栁葉而痩短又似兒尾葉亦痩窄又似黄精葉頗軟抪莖攢生味甜微澁救飢採嫩苗葉煠熟換水淘去澁味油鹽調食野蜀葵生荒野中就地叢生苗高五寸許葉似葛勒子秧葉而厚大又似地牡丹葉味辣救飢採嫩葉煠熟水浸淘淨油鹽調食蛇葡萄生荒野中拖蔓而生葉似菊葉而小花叉繁碎又似前胡葉亦細莖葉間開五瓣小銀褐花結子如豌豆大生青熟則紅色苗葉味甜救飢採葉煠熟換水浸淘淨油鹽調食治病今人傳說搗根傅貼瘡腫星宿菜生田野中作小科苗生葉似石竹子葉而細小又似米布袋葉微長梢上開五瓣小尖白花苗葉味甜救飢採苗葉煠熟水浸淘淨油鹽調食水蓑衣生水泊邊葉似地稍瓜葉而窄音側小每葉間皆結小青蓇葖音骨突其葉味苦救飢採苗葉煠熟水浸淘去苦味油鹽調食牛妳菜出輝縣山野中拖藤蔓而生葉似牛皮硝葉而大又似馬兠鈴葉極大葉皆對節生梢間開青白小花其葉味甜救飢採嫩苗葉煠熟水浸淘淨油鹽調食小蟲兒卧草一名鐵線草生田野中苗搨地生葉似苜蓿葉而極小又似雞眼草葉亦小其莖色紅開小紅花苗味甜救飢採苗葉煠熟水浸淘淨油鹽調食兒尾苗生田野中苗高一二尺葉似水葓葉而狹短其尖頗齊梢頭出穗如尾狀開花白色結紅蓇葖如椒目大其葉味酸救飢採嫩苗葉煠熟水浸淘淨油鹽調食地錦苗生田野中小科苗高五七寸苗葉似園荽音雖葉間開紫花結小角兒苗葉味苦救飢採苗葉煠熟水浸淘淨油鹽調食野西瓜苗俗名秃漢頭生田野中苗高一尺許葉似家西瓜葉而小頗硬葉間生蔕開五瓣銀褐花紫心黄蘂花罷作蒴蒴内結實如楝子大苗葉味微苦救飢採嫩苗葉煠熟水浸去邪味淘過油鹽調食治病今人傳說採苗搗傅瘡腫拔毒香茶菜生田野中莖方窊五化切面四楞葉似薄荷葉微大抪葉對生梢頭出穗開粉紫花結蒴音朔如蕎麥蒴而微小葉味苦救飢採葉煠熟水浸去苦味淘洗淨油鹽調食薔䕷音墻梅又名刺䕷今處處有之生荒野崗嶺間人家園圃中亦栽科條青色莖上多刺葉似椒葉而長鋸齒又細背頗白開紅白花亦有千葉者味甜淡救飢採芽葉煠熟換水浸淘淨油鹽調食毛女兒菜生南陽府馬鞍山中苗高一尺許葉似綿絲菜葉而微尖又似兒尾葉而小莖葉皆有白毛梢間開淡黄花如大黍粒十數顆攢成一穗味甘酸救飢採苗葉煠熟水浸淘淨油鹽調食或拌米麵蒸食亦可􅀈牛兒苗音厖又名鬭牛兒苗生田野中就地拖秧而生莖蔓細弱其莖紅紫色葉似園荽葉瘦細而稀疎開五瓣小紫花結青蓇葖音骨突兒上有一嘴即委切甚尖銳音芮如細錐音追子狀小兒取以為鬭戲葉味微苦救飢採葉煠熟換水浸去苦味淘浄油鹽調食鐵掃箒生荒野中就地叢生一本二三十莖苗高三四尺葉似苜蓿葉而細長又似細葉胡枝子葉亦短小開小白花其葉味苦救飢採嫩苗葉煠熟換水浸去苦味油鹽調食山小菜生密縣山野中科苗高二尺餘就地叢生葉似酸漿子葉而窄小面有細紋脉邊有鋸齒色深緑又似桔梗葉頗長􅕏味苦救飢採葉煠熟水浸淘去苦味油鹽調食羊角苗又名羊妳科亦名合鉢兒俗名婆婆針扎兒又名紐絲藤一名過路黄生田野下濕地中拖藤蔓而生莖色青白葉似馬兠鈴葉而長大又似山藥葉亦長大面青背頗白皆兩葉相對生莖葉折之俱有白汁出葉間出穗開五瓣小白花結角似羊角狀中有白穰其葉味甘微苦救飢採嫩葉煠熟換水浸去苦味邪氣淘淨油鹽調食耬斗菜生輝縣太行山山野中小科苗就地叢生苗高一尺許莖梗細弱葉似牡丹葉而小其頭頗團味甜救飢採葉煠熟水浸淘淨油鹽調食甌菜生輝縣山野中就地作小科苗生莖叉葉似山莧菜葉而有鋸齒又似山小菜葉其鋸齒比之却小味甜救飢採嫩苗葉煠熟水浸淘淨油鹽調食變豆菜生輝縣太行山山野中其苗葉初作地攤音灘科生葉似地牡丹葉極大五花叉鋸齒尖其後葉中分生莖叉梢葉頗小上開白花其葉味甘救飢採葉煠熟作成黄色換水淘淨油鹽調食和尚菜田野處處有之初生搨地布葉葉似野天茄兒葉而大背微紅紫色後攛苗髙二三尺葉似莙薘葉短小而尖又似紅落蔾葉而色不紅結子如灰菜子葉味辛酸微醎救飢採嫩葉煠熟換水浸去邪味淘淨油鹽調食或晒乾煠食亦可或云不可多食久食令人面腫萎蕤本草一名女萎一名熒一名地節一名玉竹一名馬薰生太山山谷及舒州滁州均州今南陽府馬鞍山亦有苗高一二尺莖斑葉似竹葉濶短而肥厚葉尖處有黄㸃又似百合葉却頗窄小葉下結青子如椒粒大其根似黄精而小異節上有鬚味甘性平無毒救飢採根換水煮極熟食之治病文具本草草部條下百合一名重箱一名摩羅一名中逢花一名強瞿生荆州山谷今處處有之苗高數尺幹麄如箭四面有葉如雞距又似大栁葉而寛青色稀疎葉近莖微紫莖端碧白開淡黄白花如石檀觜而大四垂向下覆長蘂花心有檀色每一顛須五六花子色圓如梧桐子生於枝葉間每葉一子不在花中此又異也根色白形如松子殻四向攢生中間出苗又如葫蒜重疊生二三十瓣味甘性平無毒一云有小毒又有一種開紅花名山丹不堪用救飢採根煮熟食之甚益人氣又云蒸過與蜜食之或為粉尤佳治病文具本草草部條下天門冬俗名萬歳藤又名娑羅樹本草一名顛勒或名地門冬或名筵門冬或名巔棘或名淫羊食或名管松生奉高山谷及建州漢州今處處有之春生藤蔓大如釵股長至丈餘延附草木上葉如茴香極尖細而疎滑有逆刺亦有澁而無刺者其葉如絲杉而細散皆名天門冬夏生白花亦有黄花及紫花者秋結黑子在其根枝傍入伏後無花暗結子其根白或黄紫色大如手指長二三寸大者為勝其生高地根短味甜氣香者上其生水側下地者葉細似藴而微黄根長而味多苦氣臭者下亦可服味苦甘性平大寒無毒垣衣地黄及貝母為之使畏曽青服天門冬誤食鯉魚中毒浮萍解之救飢採根換水浸去邪味去心煮食或晒乾煮熟入蜜食尤佳治病文具本草草部下章栁根本草名蔏陸一名􅛅音湯根一名夜呼一名白昌一名當陸一名章陸爾雅謂之蓫薚音逐湯廣雅謂之馬尾易謂之莧陸生咸陽川谷今處處有之苗高三四尺􅗰麄似雞冠花􅗰微有線楞色微紫赤葉青如牛舌微濶而長根如人形者有神亦有赤白二種花赤根亦赤花白根亦白赤者不堪服食傷人乃至痢血不已白者堪服食又有一種名赤昌苗葉絶相類不可用須細辨之商陸味辛酸一云味苦性平有毒一云性冷得大蒜良救飢取白色根切作片子煠熟換水浸洗淨淡食得大蒜良凡製薄切以東流水浸二宿撈出與豆葉隔間入甑蒸從午至亥如無葉用豆依法蒸之亦可花白者年多仙人採之作脯可為下酒治病文具本草草部蔏陸條下沙參一名知母一名苦心一名志取一名虎鬚一名白參一名識美一名文希生河内川谷及寃句般陽續山并淄齊潞隨歸州而江淮荆湖州郡皆有今輝縣太行山邊亦有之苗長一二尺叢生崖坡間葉似枸杞葉微長而有叉牙鋸齒開紫花根如葵根赤黄色中正白實者佳味微苦性微寒無毒惡防已反蔾蘆又有杏葉沙參及細葉沙參氣味與此相類但圖經内不曾該載此二種葉苗形容未敢併入本條今皆另條開載救飢掘根浸洗極淨換水煮去苦味再以水煮極熟食之治病文具本草草部條下麥門冬本草云秦名羊韭齊名愛韭楚名馬韭越名羊蓍一名禹葭音加一名禹餘糧生隨州陸州及函谷堤坂土石間乆廢處有之今輝縣山野中亦有葉似韭葉而長冬夏長生根如穬音礦麥而白色出江寧者小潤出新安者大白其大者苗如鹿葱小者如韭味甘性平微寒無毒地黄車前為之使惡欵冬苦瓠苦芙畏木耳苦參青蘘救飢採根換水浸去邪味淘洗淨蒸熟去心食治病文具本草草部條下苧根舊云閩蜀江浙多有之今許州人家田園中亦有種者皮可績布苗高七八尺一科十數莖葉如楮葉而不花义面青背白上有短毛又似蘇子葉其葉間出細穗花如白楊而長每一朶凡十數穗花青白色子熟茶褐色其根黄白色如手指麄宿根地中至春自生不須藏種荆揚間一歳二三刈剝其皮以竹刀刮其表厚處自脫得裏如筋者煮之用緝以苧近蠶種之則蠶不生根味甘性寒救飢採根刮洗去皮煮極熟食之甜美治病文具本草草部條下蒼术一名山薊一名山薑一名山連一名山精生鄭山漢中山谷今近郡山谷亦有嵩山茅山者佳苗淡青色高二三尺莖作蒿􅗰葉抪莖而生梢葉似棠葉脚葉有三五义皆有鋸齒小刺開花紫碧色亦似刺薊花或有黄白花者根長如指大而肥實皮黒茶褐色味苦甘一云味甘辛性温無毒防風地榆為之使救飢採根去黑皮薄切浸二三宿去苦味煮熟食亦作煎餌久服輕身延年不飢治病文具本草草部條下菖蒲一名堯韭一名昌陽生上洛池澤及蜀郡嚴道戎衛衡州并嵩岳石磧上今池澤處處有之葉似蒲而匾有脊一如劒刃其根盤屈有節狀如馬鞭􅗰大根傍引三四小根一寸九節者良節尤密者佳亦有十二節者露根者不可用又一種名蘭蓀又謂溪蓀根形氣色極似石上菖蒲葉正如蒲無脊俗謂之菖蒲生於水次失水則枯其菖蒲味辛性温無毒秦皮秦艽為之使惡地膽麻黄不可犯鐵令人吐逆救飢採根肥大節稀水浸去邪味製造作果食之治病文具本草草部條下葍子根俗名打碗花一名兒苗一名狗兒秧幽薊間謂之鷰葍根千葉者呼為纒枝牡丹亦名穰花生平澤中今處處有之延蔓而生葉似山藥葉而狹小開花狀似牽牛花微短而圓粉紅色其根甚多大者如小筋麄長一二尺色白味甘性温救飢採根洗淨蒸食之或晒乾杵碎炊飯食亦好或磨作麵作燒餅蒸食皆可久食則頭暈破腹間食則宜䓮䕅根音冒嫂俗名麵碌碡音禄讀生水邊下濕地其葉就地叢生葉似蒲葉而肥短葉背如劒脊樣葉叢中間攛葶上開淡粉紅花俱皆六瓣花頭攅開如傘葢狀結子如韭花蓇葖音骨突其根如鷹爪黄連樣色似墐泥色味甘救飢採根揩去皴音逡毛用水淘浄蒸熟食或晒乾炒熟食或磨作麵蒸食皆可野胡蘿蔔生荒野中苗葉似家胡蘿蔔但細小葉間攛生莖义梢頭開小白花衆花攢開如傘葢狀比蛇牀子花頭又大結子比蛇牀子亦大其根比家胡蘿蔔尤細小味甘救飢採根洗淨蒸食生食亦可綿棗兒一名石棗兒出密縣山谷中生石間苗高三五寸葉似韭葉而濶瓦隴様葉中攛葶出穗似雞冠莧穗而細小開淡粉紅花微帶紫色結小蒴兒其子似大藍子而小黑色根類獨顆蒜又似棗形而白味甜性寒救飢採取根添水久煮極熟食之不換水煮食後腹中鳴有下氣土圝兒一名地栗子出新鄭山野中細莖延蔓而生葉似菉豆葉微尖􅕏每三葉攢生一處根似土瓜兒根微團味甜救飢採根煮熟食之野山藥生輝縣太行山山野中妥他果切藤而生其藤似葡萄條稍細藤頗紫色其葉似家山藥葉而大微尖根比家山藥極細痩甚硬皮色微赤味微甜性温平無毒救飢採根煮熟食之治病今人與本草草部下薯蕷同用金瓜兒生鄭州田野中苗似初生小葫蘆葉而極小又似赤雹兒葉莖方莖葉俱有毛刺每葉間出一細藤延蔓而生開五瓣尖碗子黄花結子如馬㼎音雹大生青熟紅根形如雞彈微小其皮土黄色内則青白色味微苦性寒與酒相反救飢掘取根換水煮浸去苦味再以水煮極熟食之細葉沙參生輝縣太行山山衝間苗高一二尺莖似蒿􅗰音秆葉似石竹子葉而細長又似水蓑與莎同音梭衣葉亦細長梢間開紫花根似葵根而麄如拇音母指大皮色灰中間白色味甜性微寒本草有沙參苗葉莖狀所說與此不同未敢併入條下今另為一條薄載於此救飢掘取根洗淨煮熟食之治病與本草草部下沙參同用雞腿兒一名飜白草出鈞州山野中苗高七八寸細長鋸齒葉硬玉諍切厚背白其葉似地榆葉而細長開黄花根如指大長三寸許皮赤内白兩頭尖鮹味甜救飢採根煮熟食生喫亦可山蔓菁出鈞州山野中苗高一二尺莖葉皆萵苣色葉似桔梗葉頗長􅕏而不對生又似山小菜葉微窄根形類沙參如手指麄其皮灰色中間白色味甜救飢採根煮熟食生亦可食老鴉蒜生水邊下濕地中其葉直生出土四垂葉狀似蒲而短背起劒脊其根形如蒜瓣味甜救飢採根煠熟水浸淘淨油鹽調食山蘿蔔生山谷間田野中亦有之苗高五七寸四散分生莖葉其葉似菊葉而闊大微有艾香每莖五七葉排生如一大葉梢間開紫花根似野胡蘿蔔根而黲白色味苦救飢採根煠熟水浸淘去苦味油鹽調食地參又名山蔓菁生鄭州沙崗間苗高一二尺葉似初生桑科小葉微短又似桔梗葉微長開花似鈴鐸様淡紅紫色根如拇指大皮色蒼肉黲白色味甜救飢採根煮食獐牙菜生水邊苗初搨地生葉似龍鬚菜葉而長窄葉頭頗團而不尖其葉嫩薄又似牛尾菜葉亦長窄其根如茅根而嫩皮色灰黒味甜救飢掘根洗淨煮熟油鹽調食雞兒頭苗生祥符西田野中就地妥他果切秧生葉甚稀疎每五葉攢生狀如一葉其葉花义有小鋸齒葉間生蔓開五瓣黄花根义甚多其根形如香附子而鬚長皮黒肉白味甜救飢採根換水煮熟食救荒本草卷三
