body:
  text: 救荒本草卷八明周王朱橚撰菜部葉可食本草原有十三種新增十九種根可食新增二種根葉皆可食本草原有一種新增四種葉及實皆可食本草原有三種新增三種藝臺菜今處處有之葉似菠菜葉比菠菜葉兩傍多兩義開黃花結角似蔓菁角有子如小芥子大味辛性溫無毒經冬根不死辟蠧音渡救飢採苖葉煠熟水浸淘洗淨油鹽調食治病文具本草菜部條下莧菜本草有莧實一名馬莧一名莫實細莧亦同一名人莧幽闕馬齒莧菜又名五行草舊不著所出州土今處處有之以其葉青梗赤花黃根白子黑故名五行草耳味甘性寒滑救飢採苗葉先以水焯音綽過晒乾煠熟油鹽調食治病文具本草菜部條下苦蕒菜俗名老鸛菜所在有之生田野中人家園圃種者為家苦蕒腳葉似白菜小葉抱莖而生梢葉似鴉嘴形每葉間分義攛葶如穿葉狀稍間開黃花味微苦性冷無毒救飢採苗葉煠熟以水浸洗淘淨油鹽調食出蠶蛾時切不可取拗令蛾子赤爛蠶婦忌食治病文具本草菜部條下莙蓬菜所在有之人家園圃中多種苗葉搨地生葉類白菜而短葉莖亦窄葉頭稍團形狀似糜匙樣味鹹性平寒微毒救飢採苗葉煠熟以水浸洗淨油鹽調食不可多食動氣破腹治病文具本草菜部條下邪蒿生田園中今處處有之苗髙尺餘似青蒿細軟葉又似葫蘿蔔葉微細而多花義莖葉稠密梢間開小碎瓣黃花苗葉味辛性溫平無毒救飢採苗葉煠熟水浸淘淨油鹽調食生食微動風氣作羮食良不可同胡荽音雖食令人汗臭氣治病文具本草菜部條下同蒿處處有之人家園圃中多種苗髙三尺葉類葫蘿蔔葉而肥大開黃花似菊花味辛性平救飢採苗葉煠熟水浸淘淨油鹽調食不可多食動風氣熏人心令人氣滿治病文具本草菜部條下冬葵菜本草冬葵子是秋種葵覆養經冬至春結子故謂冬葵子生少室山今處處有之苗髙二三尺莖及花葉似蜀葵而差小子及根俱味甘性寒無毒黃芩為之使根解蜀椒毒葉味甘性滑利為百菜主其心傷人救飢採葉煠熟水浸淘淨油鹽調食服丹石人尤宜食天行病後食之頓喪明熱食亦令人熱悶動風治病文具本草菜部條下蓼芽菜本草有蓼實生雷澤川澤今處處有之葉似小藍葉微尖又似水葒葉而短小色微帶紅莖微赤梢間出穗開花赤色莖葉味辛性溫救飢採苗葉煠熟換水浸去辣氣淘淨油鹽調食治病文具本草菜部蓼實條下苜蓿出陜西今處處有之苖髙尺餘細莖分義而生葉似錦雞兒花葉微長又似豌豆葉頗小每三葉攢生一處梢間開紫花結彎角兒中有子如黍米大腰子樣味苦性平無毒一云微甘淡一云性凉根寒救飢苗葉嫩時採取煠食江南人不甚食多食利大小腸治病文具本草菜部條下薄荷一名雞蘇舊不著所出州土今處處有之莖方葉似荏子葉小頗細長又似香菜葉而大開細碎黲白花其根經冬不死至春發苗味辛苦性溫無毒一云性平東平龍腦岡者尤佳又有胡薄荷與此相類但味少甘為别生江浙間彼人多作茶飲俗呼為新羅薄荷又有南薄荷其葉微小救飢採苗葉煠熟換水浸去辣味油鹽調食與薤作虀音賫食相宜煎豉湯暖酒和飲煎茶並宜新病瘥人勿食令人虛汗不止猫食之即醉物相感爾治病文具本草菜部條下荆芥本草名假蘇一名鼠蓂一名薑芥生漢中川澤及嶽州歸德州今處處有之莖方窊面葉似獨掃葉而狹小淡黃緑色結小穗有細小黑子鋭圓多野生以香氣似蘇故名假蘇味辛性溫無毒救飢採嫩苗葉煠熟水浸去邪氣油鹽調食初生香辛可噉人取作生菜醃食治病文具本草菜部假蘇條下水􅀢音勤俗作芹菜一名水英出南海池澤今水邊多有之根莖離地二三寸分生莖義其莖方窊面四楞對生葉似痢見菜葉而闊短邊有大鋸齒又似薄荷葉而短開白花似蛇床子花味甘性平無毒又云大寒春秋二時龍帶精入芹菜中人遇食之作蛟龍病救飢發英時採之煠熟食芹有兩種秋芹取根白色赤芹取莖葉並堪食又有渣音柤芹可為生菜食之治病文具本草菜部條下香菜生伊洛間人家園圃種之苗髙一尺許莖方窊丑化切面四稜莖色紫稔葉似薄荷葉微小邊有細鋸齒亦有細毛梢頭開花作穗花淡藕褐色味辛香性溫救飢採苗葉煠熟油鹽調食銀條菜所在人家園圃多種苗葉皆似萵苣細長色頗青白攛葶髙二尺許開四瓣淡黃花結蒴似蕎麥蒴而圓中有子如油子大淡黃色其葉味微苦性凉救飢採苗葉煠熟水浸淘淨油鹽調食生揉音柔亦可食後庭花一名鴈來紅人家園圃多種之葉似人莧葉其葉中心紅色又有黃色相間亦有通身紅色者亦有紫色者莖葉間結實比莧實微大其葉衆葉攢聚狀如花朵其色嬌紅可愛故以名之味甜微澀性凉救飢採苗葉煠熟水浸淘淨油鹽調食晒乾煠食尤佳火焰菜人家園圃多種苗葉俱似菠菜但葉梢微紅形如火焰結子亦如菠菜子苗葉味甜性微冷救飢採苗葉煠熟水淘洗淨油鹽調食山葱一名隔葱又名鹿耳葱生輝縣太行山山野中葉似玉簪葉微團葉中攛七官切葶似蒜葶甚長而澀稍頭結蓇葖音骨突似葱蓇葖微小開白花結子黑色苗味辣救飢採苗葉煠熟油鹽調食生醃食亦可背韭生輝縣太行山山野中葉頗似韭菜而甚寬大根似葱根味辣救飢採苗葉煠熟油鹽調食生醃食亦可水芥菜水邊多生苗髙尺許葉似家芥菜葉極小色微淡緑葉多花義莖義亦細開小黃花結細短小角兒葉味微辛救飢採苗葉煠熟水浸去辣氣淘洗過油鹽調食遏藍菜上音惡生田野中下濕地苗初搨地生葉似初生菠菜葉而小其頭頗團葉間攛葶分義上結莢兒似榆錢狀而小其葉味辛香微酸性微溫救飢採苗葉煠熟水浸取酸辣味復用水淘淨作虀油鹽調食牛耳朵菜一名野芥菜生田野中苗髙一二尺苗莖似萵苣色葉似牛耳朵形而小葉間分攛葶義開白花結子如粟粒大葉味微苦辣救飢採苗葉淘洗淨煠熟油鹽調食山白菜生輝縣山野中苗葉頗似家白菜而葉莖細長其葉尖􅕏邊有鋸齒義又似莙薘菜葉而尖瘦亦小味甜微苦救飢採苗葉煠熟水淘淨油鹽調食山宜菜又名山苦菜生新鄭縣山野中苗初搨地生葉似薄荷葉而大葉根兩傍有義背白又似青莢兒菜葉亦大味苦救飢採苗葉煠熟油鹽調食山苦蕒生新鄭縣山野中苗髙二尺餘莖似萵苣葶而節稠其葉甚盛花有三五尖義似花苦苣葉甚大開淡棠褐花表微紅味苦救飢採嫩苗葉煠熟水淘去苦味油鹽調食南芥菜人家園圃中亦種之苗初搨地生後攛葶義葉似芥菜葉但小而有毛澀莖葉稍頭開淡黃花結小尖角兒葉味辛辣救飢採苗葉煠熟水浸淘去澀味油鹽調食生焯過醃食亦可山萵苣生密縣山野間苗葉搨地生葉似萵苣葉而小又似苦苣葉而却寬大葉腳花又頗少葉頭微尖邊有細鋸齒葉間攛葶開淡黃花苗葉味微苦救飢採苗葉煠熟水浸淘去苦味油鹽調食生揉亦可食黃鵪菜生密縣山谷中苗初搨地生葉似初生山萵苣葉而小葉腳邊微有花義又似孛孛丁葉而頭頗團葉中攛生葶義髙五六寸許開小黃花結小細子黃茶褐色葉味甜救飢採苗葉煠熟換水淘淨油鹽調食燕兒菜生密縣山澗邊苗葉搨地生葉似匙頭樣頗長又似牛耳朵菜葉而小微澀又似山萵苣葉亦小頗硬而頭微團味苦救飢採苗葉煠熟換水浸淘淨油鹽調食孛孛丁菜又名黃花苗生田野中苗初搨地生葉似苦苣葉微短小葉叢中間攛葶梢頭開黃花莖葉折之皆有白汁味微苦救飢採苗葉煠熟油鹽調食柴韭生荒野中苗葉形狀如韭但葉圓細而瘦葉中攛葶開花如韭花狀粉紫色苗葉味辛救飢採苗葉煠熟水浸淘淨油鹽調食生醃食亦可野韭生荒野中形狀如韭苗葉極細弱葉圓比柴韭又細小葉中攛葶開小粉紫花似韭花狀苗葉味辛救飢採苗葉煠熟油鹽調食生醃食亦可甘露兒人家園圃中多栽葉似地瓜兒葉甚闊多有毛澀其葉對節生色微淡緑又似薄荷葉亦寬而皺開紅紫花其根呼為甘露兒形如小指而紋節甚稠皮色黲白味甘救飢採根洗淨煠熟油鹽調食生醃食亦可地瓜兒苗生田野中苗髙二尺餘莖方四楞葉似薄荷葉微長大又似澤蘭葉抪莖而生根名地瓜形類甘露兒更長味甘救飢掘根洗淨煠熟油鹽調食生醃食亦可澤蒜又名小蒜生田野中今處處有之生山中者名蒿力的切苗似細韭葉中心攛葶開淡粉紫花根似蒜而甚小味辛性溫有小毒又云熱有毒救飢採苗根作羮或生醃或煠熟油鹽調皆可食治病文具本草菜部小蒜條下樓子葱人家園圃中多栽苗葉根莖俱似葱其葉稍頭又生小葱四五枝疊生三四層故名樓子葱不結子但搯音恰下小葱栽之便活味甘辣性溫救飢採苗莖連根擇去細鬚煠熟油鹽調食生亦可食治病與本草菜部下葱同用薤韭一名石韭生輝縣太行山山野中葉似蒜葉而頗窄狹又似肥韭葉微闊花似韭花頗大根似韭根甚粗味辣救飢採苗葉煠熟油鹽調食生亦可食冬月採取根煠食水蘿蔔生田野下濕地中苗初搨地生葉似薺菜形而厚大鋸齒尖花葉又似水芥葉亦厚大後分莖義梢間開淡黃花結小角兒根如白菜根而大味甘辣救飢採根及葉煠熟油鹽調食生亦可食野蔓菁生輝縣栲栳音考老圈山谷中苗葉似家蔓菁葉而薄小其葉頭尖􅕏葉腳花義甚多葉間攛出枝義上開黃花結小角其子黑色根似白菜根頗大苗葉根味微苦救飢採苗葉煠熟水浸淘淨油鹽調食或採根換水煮去苦味食之亦可薺菜生平澤中今處處有之苗榻地生作鋸齒葉三四月出葶分生莖義梢上開小白花結實小似菥蓂子苗葉味甘性溫無毒其實亦呼菥蓂音錫覔子其子味甘性平患氣人食之動冷疾不可與麵同食令人背悶服丹石人不可食救飢採子用水調攪良久成塊或作燒餅或煮粥食味甚粘滑葉煠作菜食或煮作羮皆可治病文具本草菜部條下紫蘇一名桂荏又有數種有勺蘇魚蘇山蘇出簡州及無為軍今處處有之苗髙二尺許莖方葉似蘇子葉微小莖葉背面皆紫色而氣甚香開粉紅花結小蒴其子狀如黍顆味辛性溫又云味微辛甘子無毒救飢採葉煠食煮飲亦可子研汁煮粥食之皆好葉可生食與魚作羮味佳治病文具本草菜部蘇子條下荏子所在有之生園圃中苗髙一二尺莖方葉似薄荷葉極肥大開淡紫花結穗似紫蘇穗其子如黍粒其枝莖對節生東人呼為䔡音魚以其蘇字但除禾邊故也味辛性溫無毒救飢採嫩苗葉煠熟油鹽調食子可炒食又研之雜米作粥甚肥美亦可笮油用治病文具本草菜部條下灰菜生田野中處處有之苗髙二三尺莖有紫紅線楞葉有灰􅀈音勃結青子成穗者甘散穗者微苦性暖生墻下樹下者不可用救飢採苖葉煠熟水浸淘淨去灰氣油鹽調食晒乾煠食尤佳穗成熟時採子搗為米磨麵作餅蒸食皆可丁香茄兒亦名天茄兒延蔓而生人家園籬邊多種莖紫多刺藤長丈餘葉似牽牛葉甚大而無花義又似初生嫩檾葉却小開粉紫邊紫色心筒子花狀如牽牛花樣結小茄如丁香樣而大有子如白牽牛子亦大味微苦救飢採茄兒煠食或醃作菜食嫩葉亦可煠熟油鹽調食山藥本草名薯蕷一名山芋一名諸薯一名修脆音翠一名兒草秦楚名玉延鄭越名土薯音諸出明州滁州生嵩山山谷今處處有之春生苗蔓延籬援莖紫色葉青有三尖角似千葉狗兒秧葉而光澤開白花結實如皂莢子大其根皮色黲黃中則白色人家園圃種者肥大如手臂味美懷孟間産者入藥最佳味甘性溫平無毒紫芝為之使惡甘遂救飢掘取根蒸食甚美或火燒熟食或煮食皆可其實亦可煮食治病文具本草草部薯蕷條下救荒本草卷八
