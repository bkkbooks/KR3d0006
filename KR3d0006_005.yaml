body:
  text: 救荒本草卷五明周王朱橚撰木部葉可食本草原有八種新增三十三種茶樹本草有茗苦􅟒與茶字同圖經云生山南漢中山谷閩浙蜀荆江湖淮南山中皆有之惟建州北苑數處産者性味獨與諸方不同今密縣梁家衝山谷間亦有之其樹大小皆類梔子春初生芽為雀舌麥顆又有新芽一發便長寸餘微粗如針漸至環腳軟枝條之類葉老則似水茶白葉而長又似初生青岡橡葉而少光澤又云冬生葉可作羮飲世呼早採者為􅟒與茶字同晚取者為茗一名荈音喘蜀今謂之苦􅟒今通謂之茶茶荼聲近故呼之又有研治作餅名為臘茶者皆味甘苦性微寒無毒加茱萸葱薑等良又别有一種䝉山中頂上清峰茶云春分前後多聚人力候雷初發聲併手齊採若得四兩服之即為地仙救飢採嫩葉或冬生葉可煮作羮食或蒸焙作茶皆可治病文具本草木部茗苦􅟒條下夜合樹本草名合歡一名合昏生益州及維洛山谷今鈞州鄭州山野中亦有之木似梧桐其枝甚柔弱葉似皂莢葉又似槐葉極細而密互相交結每一風來輒似相解了不相牽綴其葉至暮而合故名合昏花發紅白色瓣上若絲茸然散垂結實作莢子極薄細味甘性平無毒救飢採嫩葉煠熟水浸淘淨油鹽調食晒乾煠食尤好治病文具本草木部合歡條下木槿樹本草云木槿如小葵花淡紅色五葉成一花朝開暮斂花與枝兩用湖南北人家多種植為籬障亦有千葉者人家園圃多栽種性平無毒葉味甜救飢採嫩葉煠熟泠水淘淨油鹽調食治病文具本草木部條下白楊樹本草白楊樹皮舊不載所出州土今處處有之此木髙大皮白似楊故名葉圓如梨肥大而尖葉背甚白葉邊鋸齒狀葉蒂小無風自動也味苦性平無毒救飢採嫩葉煠熟作成黃色換水淘去苦味洗淨油鹽調食治病文具本草木部條下黃櫨生商洛山谷今鈞州新鄭山野中亦有之葉圓木黃枝莖色紫赤葉似杏葉而圓大味苦性寒無毒木可染黃救飢採嫩葉煠熟水淘去苦味油鹽調食治病文具本草木部條下椿樹芽本草有椿木樗木舊不載所出州土今處處有之二木形幹大扺相類椿木實而葉香可噉樗木疏而氣臭膳夫熬去其氣亦可噉北人呼樗為山椿江東人呼為虎目葉脫處有痕如樗蒲子又如眼目故得此名夏中生莢樗之有花者無莢有莢者無花莢常生臭樗上未見椿上有莢者然世俗不辨椿樗之異故俗名為椿莢其實樗莢耳其無花不實木大端直為椿有花而莢木小幹多迂矮者為樗椿味苦有毒樗味苦有小毒性溫一云性熱無毒救飢採嫩葉煠熟水浸淘淨油鹽調食治病文具本草木部椿木樗木及椿莢條下椒樹本草蜀椒一名南椒一名巴椒一名蓎藙音唐毅生武都川谷及巴郡歸峽蜀川陜洛間人家園圃多種之髙四五尺似茱萸而小有針刺葉似刺䕷葉微小葉堅而滑可煮食甚辛香結實無花但生於葉間如豆顆而圓皮紫赤此椒江淮及北土皆有之莖實皆相類但不及蜀中者皮肉厚腹裏白氣味濃烈耳又云出金州西城者佳味辛性溫大熱有小毒多食令人乏氣口閉者殺人十月勿食椒損氣傷心令人多忘杏仁為之使畏欵冬花救飢採嫩葉煠熟換水浸淘淨油鹽調食椒顆調和百味香美治病文具本草木部蜀椒條下椋子樹上音良本草有椋子木舊不載所出州王今密縣山野中亦有之其樹有大者木則堅重材堪為車輞初生作科條狀類荆條對生枝義葉似柿葉而薄小兩葉相當對生開白花結子細圓如牛李子大如豌豆生青熟黑味甚鹹性平無毒葉味苦救飢採葉煠熟水浸淘去苦味洗淨油鹽調食治病文具本草木部條下雲桑生密縣山野中其樹枝葉皆類桑但其葉如雲頭花義又似木欒樹葉微闊開細青黃花其葉味微苦救飢採嫩葉煠熟換水浸淘去苦味油鹽調食或蒸晒作茶尤佳黃楝樹生鄭州南山野中葉似初生椿樹葉而極小又似楝葉色微帶黃開花紫赤色結子如豌豆大生青熟亦紫赤色葉味苦救飢採嫩芽葉煠熟換水浸去苦味油鹽調食蒸芽曝乾亦可作茶煮飲凍青樹生密縣山谷間樹髙丈許枝葉似枸骨子樹而極茂盛凌冬不凋又似樝音柤子樹葉而小亦似穁芽葉微窄頭頗團而不尖開白花結子如豆粒大青黑色葉味苦救飢採芽葉煠熟水浸去苦味淘洗淨油鹽調食穁芽樹上音冗生輝縣山野中科條似槐條葉似冬青葉微長開白花結青白子其葉味甜救飢採嫩葉煠熟水淘淨油鹽調食月芽樹又名芿音仍芽生田野中莖似槐條葉似歪頭菜葉微短稍硬又似穁芽葉頗長􅕏其葉兩兩對生味甘微苦救飢採嫩葉煠熟水浸淘淨油鹽調食女兒茶一名牛李子一名牛筋子生田野中科條髙五六尺葉似郁李子葉而長大稍尖葉色光滑又似白棠子葉而色微黃緑結子如豌豆大生則青熟則黑茶褐色其葉味淡微苦救飢採嫩葉煠熟水浸淘淨油鹽調食亦可蒸曝作茶煮飲省沽油又名珍珠花生鈞州風谷頂山谷中科條似荆條而圓對生枝義葉亦對生葉似驢駝布袋葉而大又似葛藤葉却小每三葉攢生一處開白花似珍珠色葉味甘微苦救飢採葉煠熟水浸淘淨油鹽調食白槿樹生密縣梁家衝山谷中樹髙五七尺葉似茶葉而甚闊大尤潤又似初生青岡葉而無花義又似山格刺樹葉亦大開白花其葉味苦救飢採嫩葉煠熟換水浸去苦味油鹽調食回回醋一名淋朴􅈪生密縣韶華山山野中樹髙丈餘葉似兜櫨樹葉而厚大邊有大鋸齒又似厚椿葉而亦大或三葉或五葉排生一莖開白花結子大如豌豆熟則紅紫色味酸葉味微酸救飢採葉煠熟水浸去酸味淘淨油鹽調食其子調和湯味如醋槭樹芽槭音色生鈞州風谷頂山谷間木髙一二丈其葉狀類野葡萄葉五花尖義亦似綿花葉而薄小又似絲瓜葉却甚小而淡黃緑色開白花葉味甜救飢採葉煠熟以水浸作成黃色換水淘淨油鹽調食老葉兒樹生密縣山野中樹髙六七尺葉似茶葉而窄瘦尖􅕏又似李子葉而長其葉味甘微澀救飢採葉煠熟水浸去澀味淘洗淨油鹽調食青楊樹在處有之今密縣山野間亦多有其樹髙大葉似白楊樹葉而狹小色青皮亦頗青故名青楊其葉味微苦救飢採葉煠熟水浸作成黃色換水淘淨油鹽調食龍柏芽出南陽府馬鞍山中此木久則亦大葉似初生橡櫟音歷小葉而短味微苦救飢採芽葉煠熟換水浸淘淨油鹽調食兜櫨樹生密縣梁家衝山谷中樹甚髙大其木枯朽極透可作香焚俗名壞香葉似回回醋樹葉而薄窄又似花楸樹葉却少花義葉皆對生味苦救飢採嫩芽葉煠熟水浸去苦味淘洗淨油鹽調食青岡樹舊不載所出州土今處處有之其木大而結橡斗者為橡櫪音歷小而不結橡斗者為青岡其青岡樹枝葉條幹皆類橡櫟但葉色頗青而少花義味苦性平無毒救飢採嫩葉煠熟以水浸漬音自作成黃色換水淘洗淨油鹽調食檀樹芽生密縣山野中樹髙一二丈葉似槐葉而長大開淡粉紫花葉味苦救飢採嫩芽葉煠熟換水浸去苦味淘洗淨油鹽調食山茶科生中牟土山田野中科條髙四五尺枝梗灰白色葉似皂莢葉而團又似槐葉亦團四五葉攢生一處葉甚稠密味苦救飢採嫩葉煠熟水淘洗淨油鹽調食亦可蒸晒乾做茶煮飲木葛生新鄭縣山野中樹髙丈餘枝似杏枝葉似杏葉而團又似葛根葉而小味微甜救飢採葉煠熟水浸淘淨油鹽調食花楸樹生密縣山野中其樹髙大葉似回回醋葉微薄又似兜櫨樹葉邊有鋸齒義其葉味苦救飢採嫩芽葉煠熟換水浸去苦味淘洗淨油鹽調食白辛樹生滎陽塔兒山岡野間樹髙丈許葉似青檀樹葉頗長而薄色微淡緑又似月芽樹葉而大色亦差淡其葉味甘微澀救飢採葉煠熟水浸淘去澀味油鹽調食木欒樹生密縣山谷中樹髙丈餘葉似楝葉而寬大稍薄開淡黃花結薄殼中有子大如豌豆烏黑色人多摘取串作數珠葉味淡甜救飢採嫩芽葉煠熟換水浸淘淨油鹽調食烏稜樹生密縣梁家衝山谷中樹高丈餘葉似省沽油樹葉而背白又似老婆布䩞葉微小而􅕏開白花結子如梧桐子大生青熟則烏黑其葉味苦救飢採葉煠熟換水浸去苦味作過淘洗淨油鹽調食刺楸樹生密縣山谷中其樹髙大皮色蒼白上有黃白斑㸃枝梗間多有大刺葉似楸葉而薄味甘救飢採嫩芽葉煠熟水浸淘淨油鹽調食黃絲藤生輝縣太行山山谷中條類葛條葉似山格刺葉而小又似婆婆枕頭葉頗硬背微白邊有細鋸齒味甜救飢採葉煠熟水浸淘淨油鹽調食山格刺樹生密縣韶華山山野中作科條生葉似白槿樹葉頗短而尖􅕏音肖又似茶樹葉而闊大及似老婆布䩞葉亦大味甘救飢採葉煠熟水浸作成黃色淘洗淨油鹽調食􅀢樹杭去聲生輝縣太行山山谷中其樹髙丈餘葉似槐葉而大却頗軟薄又似檀樹葉而薄小開淡紅色花結子如菉豆大熟則黃茶褐色其葉味甜救飢採葉煠熟水浸淘淨油鹽調食報馬樹生輝縣太行山山谷間枝條似桑條色葉似青檀葉而大邊有花義又似白辛葉頗大而長硬葉味甜救飢採嫩葉煠熟水淘淨油鹽調食硬葉煠熟水浸作成黃色淘去涎沫油鹽調食椵樹生輝縣太行山山谷間樹甚髙大其木細膩可為桌器枝義對生葉似木槿葉而長大微薄色頗淡緑皆作五花丫音鴉義邊有鋸齒開黃花結子如豆粒大色青白葉味苦救飢採嫩葉煠熟水浸去苦味淘洗淨油鹽調食臭􅵮臭去聲生密縣楊家衝山谷中科條髙四五尺葉似杵瓜葉而尖􅕏音哨又似金銀花葉亦尖􅕏五葉攢生如一葉開花白色其葉味甜救飢採葉煠熟水浸淘淨油鹽調食堅莢樹生輝縣太行山山谷中其樹枝幹堅徑可以作棒皮色烏黑對分枝義葉亦對生葉似拐棗葉而大微薄其色淡緑又似土欒樹葉極大而光潤開黃花結小紅子其葉味苦救飢採嫩葉煠熟水浸去苦味淘洗淨油鹽調食臭竹樹生輝縣太行山山野中樹甚高大葉似楸葉而厚頗􅕏却少花義又似拐棗葉亦大其葉面青背白味甜救飢採葉煠熟水浸去邪臭氣味油鹽調食馬魚兒條俗名山皂角生荒野中葉似初生刺䕷花葉而小枝梗色紅有刺似棘針微小葉味甘微酸救飢採葉煠熟水浸淘淨油鹽調食老婆布䩞生鈞州風谷頂山野間科條淡蒼黃色葉似匙頭樣色嫩緑而光俊又似山格刺葉却小味甘救飢採葉煠熟水浸作過淘淨油鹽調食救荒本草卷五
