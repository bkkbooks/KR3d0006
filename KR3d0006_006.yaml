body:
  text: 救荒本草卷六明周王朱橚撰木部實可食本草原有六種新增十四種葉及實皆可食本草原有五種新增三種花可食新增五種花葉皆可食本草原有一種花葉實皆可食新增二種葉皮及實皆可食本草原有二種笋可食本草原有一種米榖部實可食新增七種㽔核樹俗名㽔李子生函谷川谷及巴西河東皆有今古崤闗西茶店山谷間亦有之其木髙四五尺枝條有刺葉細似枸杞葉而尖長又似桃葉而狹小亦薄花開白色結子紅紫色附枝莖而生狀類五味子其核仁味甘性温微寒無毒其果味甘酸救飢摘取其果紅紫色熟者食之治病文具本草木部條下酸棗樹爾雅謂之樲棗出河東川澤今城壘坡野間多有之其木似棗而皮細莖多棘刺葉似棗葉微小花似棗花結實紫紅色似棗而圓小核中仁微扁名酸棗仁入藥用味酸性平一云性微熱惡防已救飢採取其棗為果食之亦可釀酒熬作燒酒飲未紅熟時採取煑食亦可治病文具本草木部條下橡子樹本草橡實櫟音歴木子也其殻一名杼土與切斗所在山谷有之木髙二三丈葉似栗葉而大開黄花其實橡也有梂彚音胃自裹其殻即橡斗也橡實味苦澁性微温無毒其殻斗可染皂救飢取子換水浸煮十五次淘去澁味蒸極熟食之厚腸胃肥健人不飢治病文具本草木部橡實條下荆子本草有牡荆實一名小荆實俗名黄荆生河間南陽寃句山谷并眉州蜀州平夀都鄉髙岸及田野中今處處有之即作箠杖者作科條生枝莖堅勁對生枝义葉似麻葉而疎短又有葉似㮏葉而短小却多花义者開花作穗花色粉紅微帯紫結實大如黍粒而黄黒色味苦性温無毒防風為之使惡石膏烏頭陶隠居登真隱訣云荆木之華葉通神見鬼精救病採子換水浸淘去苦味晒乾搗磨為麵食之治病文具本草木部牡荆實條下實棗兒樹本草名山茱萸一名蜀棗一名鷄足一名鬾音妓實一名鼠矢生漢中川谷及琅琊寃句東海承縣海州今鈞州宻縣山谷中亦有之木髙丈餘葉似榆葉而寛稍團紋脉微麄開淡黄白花結實似酸棗大微長兩頭尖􅕏色赤既乾則皮薄味酸性平微温無毒一云味鹹辛大熱蓼實為之使惡桔梗防風防已救飢摘取實棗紅熟者食之治病文具本草木部山茱萸條下孩兒拳頭本草名莢蒾音迷一名擊蒾一名弄先舊不著所出州土但云所在山谷多有之今輝縣太行山山野中亦有其木作小樹葉似木槿而薄又似杏葉頗大亦薄澁枝葉間開黄花結子似溲疏兩兩切並四四相對數對共為一攅生則青熟則赤色味甘苦性平無毒葢檀榆之類也其皮堪為索救飢採子紅熟者食之又煮枝汁少加米作粥甚美治病文具本草木部莢蒾條下山䔧兒一名金剛樹又名鉄刷子生鈞州山野中科條髙三四尺枝條上有小刺葉似杏葉頗團小開白花結實如葡萄顆大熟則紅黄色味甘酸救飢採果食之山裏果兒一名山裏紅又名映山紅果生新鄭縣山野中枝莖似初生桑條上多小刺葉似菊花葉稍團又似花桑葉亦團開白花結紅果大如櫻桃味甜救飢採樹熟果食之無花果生山野中今人家園圃中亦栽葉形如葡萄葉頗長硬而厚梢作三义枝葉間生果初則青小熟大狀如李子色似紫茄色味甜救飢採果食之治病今人傳説治心痛用葉煎湯服甚效青舍子條生宻縣山谷間科條微帶柿黄色葉似胡枝子葉而光俊微尖枝條梢間開淡粉紫花結子似枸把子微小生則青而後變紅熟則紫黑色味甜救飢採摘其子紫熟者食之白棠子樹一名沙棠棃兒一名羊妳子樹又名剪子果生荒野中枝梗似棠梨樹枝而細其色微白葉似棠葉而窄小色亦頗白又似女兒茶葉却大而背白結子如豌豆大味酸甜救飢其子甜熟時摘取食之拐棗上古買切生宻縣梁家衝山谷中葉似楮葉而無花又却更尖􅕏面多紋脉邊有細鋸齒開淡黄花結實狀似生姜拐义而細短深茶褐色故名拐棗味甜救飢摘取拐棗成熟者食之木桃兒樹生中牟土山間樹髙五尺餘枝條上氣脉積聚為疙瘩達狀類小桃兒極堅實故名木桃其葉似楮葉而狹小無花义却有細鋸齒又似青檀葉梢間另又開淡紫花結子似梧桐子而大熟則淡銀褐色味甜可食救飢採取其子熟者食之石岡橡生汜水西茶店山谷中其木髙丈許葉似橡櫟葉極小而薄邊有鋸齒而少花义開黄花結實如橡斗而極小味澁微苦救飢採實換水煮五七水令極熟食之水茶臼生宻縣山谷中科條髙四五尺莖上有小刺葉似大葉胡枝子葉而有尖又似黒豆葉而光厚亦尖開黄白花結果如杏大狀似甜𤓰瓣而色紅味甜酸救飢果熟紅時摘取食之野木𤓰一名八月樝音柤又名杵𤓰出新鄭縣山野中蔓延而生妥他果切附草木上葉似黒豆葉微小光澤四五葉攅生一處結𤓰如肥皂大味甜救飢採嫩𤓰換水煮食樹熟者亦可摘食土欒樹生汜水西茶店山谷中其木髙大堅勁人常採斫以為秤簳音稈葉似木葛葉微狹而厚背頗白微毛又似青楊葉亦窄開淡黄花結子小如豌豆而扁生則青色熟則紫黒色味甘救飢摘取其實紫熟者食之驢駝布袋生鄭州沙崗間科條高四五尺枝梗微帶赤黄色葉似郁李子葉頗大而光又似省沽油葉而尖頗齊其葉對生開花色白結子如菉豆大兩兩並生熟則色紅味甜救飢採紅熟子食之婆婆枕頭生鈞州宻縣山坡中科條髙三四尺葉似櫻桃葉而長􅕏開黄花結子如菉豆大生則青熟紅色味甜救飢採熟紅子食之吉利子樹一名急䕷子科荒野處處有之科條高五六尺葉似野桑葉而小又似櫻桃葉亦小枝葉間開五瓣小尖花碧玉色其心黄色結子如椒粒大兩兩並生熟則紅色味甜救飢其子熟時採摘食之枸杞一名杞根一名枸忌一名地輔一名羊乳一名却暑一名仙人杖一名西王母杖一名地仙苗一名托盧或名天精或名却老一名枸檵音繼一名苦杞俗呼為甜菜子根名地骨生常山平澤今處處有之其莖幹高三五尺上有小刺春生苗葉如石榴葉而軟薄莖葉間開小紅紫花隨便結實形如棗核熟則紅色味微苦性寒根大寒子微寒無毒一云味甘平白色無刺者良陜西枸杞長一二丈圍數寸無刺根皮如厚朴甘美異於諸處生子如櫻桃全少核曝乾如餅極爛有闕救飢採葉煠熟水淘凈油鹽調食作羮食皆可子紅熟時亦可食若渇煮葉作飲以代茶飲之治病文具本草木部條下栢樹本草有栢實生太山山谷及陜州宜州其乾州者最佳宻州側栢葉尤佳今處處有之味甘一云味甘辛性平無毒葉味苦一云味苦辛微温無毒牡蠣及桂𤓰子為之使畏菊花羊蹄草諸石及麵麴救飢列仙傳云赤松子食栢子齒落更生採栢葉新生并嫩者換水浸其苦味初食苦澁入蜜或棗肉和食尤好後稍易喫遂不復飢冬不寒夏不熱治病文具本草木部栢實條下皂筴樹生雍州川谷及魯之鄒縣懷孟產者為勝今處處有之其木極有高大者葉似槐葉瘦長而尖枝間多刺結實有三種形小者為猪牙皂筴良又有長六寸及尺二者用之當以肥厚者為佳味辛鹹性温有小毒枯實為之使惡麥門冬畏空青人參苦參可作沐藥不入湯救飢採嫩芽煠熟換水浸洗淘凈油鹽調食又以子不以多少炒舂去赤皮浸軟煮熟以糖漬之可食治病文具本草木部條下楮桃樹本草名楮實一名榖音構實生少室山今所在有之樹有二種一種皮有斑花紋謂之斑榖人多用皮為冠一種皮無花紋枝葉大相類其葉似葡萄葉作瓣义上多毛澁而有子者為佳其桃如彈大青緑色後漸變深紅色乃成熟浸洗去穰取中子入藥一云皮斑者是楮皮白者是榖皮可作紙實味甘性寒葉味甘性凉俱無毒救飢採葉并楮桃帶花煠爛水浸過握乾作餅焙熟食之或取樹熟楮桃紅蘂食之甘美不可久食令人骨軟治病文具本草木部楮實條下柘樹本草有柘木舊不載所出州土今北土處處有之其木堅勁皮紋細宻上多白㸃枝條多有刺葉比桑葉甚小而薄色頗黄淡葉稍皆三义亦堪飼蠶綿柘刺少葉似柿葉微小枝葉間結實狀如楮桃而小熟則亦有紅蘃味甘酸葉味甘微苦柘木味甘性温無毒救飢採嫩葉煠熟以水浸洳作成黄色換水浸去邪味再以水淘淨油鹽調食其實紅熟甘酸可食治病文具本草木部條下木羊角科又名羊桃科一名小桃花生荒野中紫莖葉似初生桃葉光俊色微帶黄枝間開紅白花結角似豇豆角甚細而尖􅕏毎两角並生一處味微苦酸救飢採嫩稍葉煠熟水浸淘凈油鹽調食嫩角亦可煠食青檀樹生中牟南沙崗間其樹枝條有紋細薄葉形類棗葉微尖􅕏背白而澁又似白辛樹葉微小開白花結青子如梧桐子大葉味酸澁實味甘酸救飢採葉煠熟水浸淘去酸味油鹽調食其實成熟亦可摘食山檾樹生宻縣梁家衝山谷中樹髙丈餘葉似初生檾葉又似芙蓉葉而小又似牽牛花葉葉肩兩傍却又有角义開白花結子如枸杞子大熟則紫黒色味甘酸葉味苦救飢採葉煠熟水浸去苦味淘洗凈油鹽調食其子熟時摘取食之藤花菜生荒野中沙崗間科條叢生葉似皂角葉而大又似嫩椿葉而小淺黄緑色枝間開淡紫花味甘救飢採花煠熟水浸淘凈油鹽調食微焯過晒乾煠食尤佳欛齒花上音罷本名錦鷄兒花又名醬瓣子生山野間人家園宅間亦多栽葉似枸杞子葉而小毎四葉攅生一處枝梗亦似枸杞有小刺開黄花狀類雞形結小角兒味甜救飢採花煠熟油鹽調食炒熟喫茶亦可楸樹所在有之今宻縣梁家衝山谷中多有樹甚髙大其木可作琴瑟葉類梧桐葉而薄小葉梢作三角尖义開白花味甘救飢採花煠熟油鹽調食及將花晒乾或煠或炒皆可食臘梅花多生南方今北土亦有之其樹枝條頗類李其葉似桃葉而寛大紋脉微麄開淡黄花味甘微苦救飢採花煠熟水浸淘凈油鹽調食馬棘生滎陽崗野間科條髙四五尺葉似夜合樹葉而小又似蒺䔧葉而硬玉諍切又似新生皂莢科葉亦小稍間開粉紫花形狀似錦雞兒花微小味甜救飢採花煠熟水浸淘凈油鹽調食槐樹芽本草有槐實生河南平澤今處處有之其木有極高大者爾雅云槐有數種葉大而黒者名櫰公回切槐晝合夜開者名守宫槐葉細而青緑者但謂之槐其功用不言有别開黄花結實似豆角狀味苦酸鹹性寒無毒景天為之使救飢採嫩芽煠熟換水浸淘洗去苦味油鹽調食或採槐花炒熟食之治病文具本草木部槐實條下棠梨樹今處處有之生荒野中葉似蒼术葉亦有團葉者有三义葉者葉邊皆有鋸齒又似女兒茶葉其葉色頗黲白開白花結棠梨如小楝子大味甘酸花葉味微苦救飢採花煠熟食或晒乾磨麵作燒餅食亦可及採嫩葉煠熟水浸淘凈油鹽調食或蒸晒作茶亦可其棠梨經霜熟時摘食甚美文冠花生鄭州南荒野間陜西人呼為崖木𤓰樹髙丈許葉似榆樹葉而狹小又似山茱萸葉亦細短開花彷彿似藤花而色白穗長四五寸結實狀似枳殻而三瓣中有子二十餘顆如肥皂角子子中瓤如栗子味微淡又似米麵味甘可食其花味甜其葉味苦救飢採花煠熟油鹽調食或採葉煠熟水浸淘去苦味亦用油鹽調食及摘實取子煮熟食瓤桑椹樹本草有桑根白皮舊不載所出州土今處處有之其葉飼蠶結實為桑椹有黒白二種桑之精英盡在於椹桑根白皮東行根益佳肥白者良出土者不可用殺人味甘性寒無毒製造忌鐵器及鉛葉椏者名雞桑最堪入藥續斷麻子桂心為之使桑椹味甘性暖或云木白皮亦可用救飢採桑椹熟者食之或熬成膏攤於桑葉上晒乾搗作餅收蔵或直取椹子晒乾可蔵經年及取椹子清汁置瓶中封三二日即成酒其色味似葡萄酒甚佳亦可熬燒酒可蔵經年味力愈佳其葉嫩老皆可煠食皮炒乾磨麵可食治病文具本草木部桑根白皮條下榆錢樹本草有榆皮一名零榆生潁川山谷秦州今處處有之其木髙大春時未生葉其枝條間先生榆莢形狀似錢而薄小色白俗呼為榆錢後方生葉似山茱萸葉而長尖􅕏潤澤榆皮味甘性平無毒救飢採肥嫩榆葉煠熟水浸淘淨油鹽調食其榆錢煮糜羮食佳但令人多睡或焯過晒乾備用或為醬皆可食榆皮刮去其上乾燥皴澁者取中間軟嫩皮剉碎晒乾炒焙極乾搗磨為麵拌糠麧草末蒸食取其滑澤易食又云榆皮與檀皮為末服之令人不飢根皮亦可搗磨為麵食治病文具本草木部榆皮條下竹笋本草竹葉有䈽音謹又音允竹葉苦竹葉淡竹葉本經並不載所出州土今處處有之竹之類甚多而入藥者惟此三種人多不能盡别䈽竹堅而促節體圓而質勁成白如霜作笛者有一種亦不名䈽竹苦竹亦有二種一種出江西及閩中本極麄大笋味甚苦不可噉一種出江浙近地亦時有之肉厚而葉長濶笋微苦味俗呼甜苦笋食所最貴者亦不聞入藥用淡竹肉薄節間有粉南人以燒竹瀝者醫家只用此一品又有一種薄殻者名甘竹葉最勝又有實中竹篁竹並以笋為佳於藥無用凡取竹瀝惟用淡竹苦竹䈽竹爾陶隠居云竹實出藍田江東乃有花而無實而頃來斑斑有實狀如小麥堪可為飯圗經云竹笋味甘無毒又云寒救飢採竹嫩笋煠熟油鹽調食焯過晒乾煠食尤好治病文具本草木部竹葉條下野豌豆生田野中苗初就地拖秧而生後分生莖义苗長二尺餘葉似胡豆葉稍大又似苜蓿葉亦大開淡粉紫花結角似家豌豆角但秕音比小味苦救飢採角煮食或收取豆煮食或磨麵製造食用與家豆同􅀈豆生平野中北土處處有之莖蔓延附草木上葉似黒豆葉而窄小微尖開淡粉紫花結小角其豆似黒豆形極小味甘救飢打取豆淘洗凈煮食或磨為麵打餅蒸食皆可山扁豆生田野中小科苗髙一尺許稍葉似蒺䔧葉微大根葉比苜蓿葉頗長又似初生豌豆葉開黄花結小匾角兒味甜救飢採嫩角煠食其豆熟時收取豆煮食回回豆又名那合豆生田野中莖青葉似蒺䔧葉又似初生嫩皂莢葉而有細鋸齒開五瓣淡紫花如蒺䔧花様結角如杏仁様而肥有豆如牽牛子微大味甜救飢採豆煮食胡豆生田野間其苗初搨地生後分莖义葉似苜蓿葉而細莖葉梢間開淡葱白褐花結小角有豆如􅀈豆狀味甜救飢採取豆煮食或磨麵食皆可蠶豆今處處有之生田園中科苗髙二尺許莖方其葉狀類黒豆葉而團長光澤紋脉竪直色似豌豆頗白莖葉梢間開白花結短角其豆如豇豆而小色赤味甜救飢採豆煮食炒食亦可山菉豆生輝縣太行山車箱衝山野中苗莖似家菉豆莖微細菉比家菉豆葉狹窄尖􅕏開白花結角亦瘦小其豆黲緑色味甘救飢採取其豆煮食或磨麵攤煎餅食亦可救荒本草卷六
